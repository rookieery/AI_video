<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="shared.css">
<script src="shared.js"></script>
<style>
  .jarbody { position: absolute; left: 790px; top: 380px; width: 340px; height: 420px;
    border: 6px solid #9a783e; border-radius: 0 0 80px 80px; box-shadow: inset 0 0 60px rgba(216,179,106,.07); }
  .jarlid  { position: absolute; left: 758px; top: 322px; width: 404px; height: 74px;
    border: 6px solid #d8b36a; border-radius: 18px; }
  .jarslot { position: absolute; left: 880px; top: 340px; width: 120px; height: 38px;
    background: #0a0908; border-radius: 50%; }
  #bloom { position: absolute; border-radius: 50%; pointer-events: none;
    background: radial-gradient(circle, rgba(232,201,106,.5) 0%, rgba(232,201,106,.12) 45%, transparent 70%); }
</style></head><body>
<div class="stage" id="root">
  <div id="bloom"></div>
  <div class="jarbody"></div><div class="jarlid"></div><div class="jarslot"></div>
</div>
<script>
const root = document.getElementById('root');
const coin = makeCoin(root, 960, 200, 220);
const bloom = document.getElementById('bloom');
const subs = makeSubs(root, [
  [0.1, 3.4, '躺平，不是认输，'],
  [3.5, 6.6, '是算清楚之后，最便宜的那种活法。', ['最便宜的活法']],
  [6.8, 9.8, '躺平，也许更省钱，也更快乐。', ['更省钱，也更快乐']],
]);

window.film = {
  duration: 12.2,
  ready: document.fonts.ready,
  frame(t) {
    const jarA = clamp01(span(t, 0, .8));
    root.querySelectorAll('.jarbody,.jarlid,.jarslot').forEach(e => e.style.opacity = jarA);
    subs(t);

    // 硬币下落 → 躺平（正面朝上）→ 光晕绽放
    const fall = eInQuad(span(t, 0.5, 2.3));
    const settle = span(t, 2.3, 2.9);
    const y = 140 + fall * 620 + (settle > 0 ? eOutBounce(settle) * 40 - 40 : 0);
    const rotX = 68 - 68 * eOutCubic(settle);
    coin.set(t * 130 - settle * 130, rotX, 1, clamp01(span(t, .4, 1.0)));
    coin.el.style.left = (960 - 110 + Math.sin(t * 2.2) * (1 - settle) * 24) + 'px';
    coin.el.style.top = (y - 110) + 'px';

    const bl = span(t, 2.5, 3.9);
    bloom.style.left = (960 - 330 * bl - 110) + 'px'; bloom.style.top = (740 - 330 * bl - 110) + 'px';
    bloom.style.width = bloom.style.height = 660 * bl + 'px';
    bloom.style.opacity = .9 * bl * (1 - span(t, 6.5, 9.0) * .6);

    // 定格 → 淡出至黑
    root.style.opacity = 1 - span(t, 10.6, 12.15);
  }
};
</script></body></html>
