<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="shared.css">
<script src="shared.js"></script>
<style>
  .base { position: absolute; inset: 0;
    background: radial-gradient(ellipse 62% 55% at 52% 44%, #1b1610 0%, #0e0b08 55%, #050403 100%); }
  .vig { position: absolute; inset: 0;
    background: radial-gradient(ellipse 80% 78% at 50% 50%, transparent 55%, rgba(0,0,0,.52) 100%); }
  .dot { position: absolute; border-radius: 50%; background: #e8c96a; will-change: transform, opacity; }
  #grain { position: absolute; inset: 0; width: 1920px; height: 1080px; opacity: .5; }
</style></head><body>
<div class="stage">
  <div class="base"></div><div id="dots"></div>
  <canvas id="grain" width="960" height="540"></canvas>
  <div class="vig"></div>
</div>
<script type="module">
const dotRoot = document.getElementById('dots'), grain = document.getElementById('grain');
const gctx = grain.getContext('2d', { willReadFrequently: false });
const rng = mulberry32(7), N = 150, dots = [];
for (let i = 0; i < N; i++) {
  const d = document.createElement('div'); d.className = 'dot';
  dotRoot.appendChild(d);
  dots.push({ el: d, fx: .02 + rng() * .96, fy: .03 + rng() * .92,
    r: .7 + rng() * 2.1, ph: rng() * 6.283, sp: .15 + rng() * .5 });
}
const gbuf = gctx.createImageData(960, 540);
const u32 = new Uint32Array(gbuf.data.buffer);
window.film = {
  duration: 141,
  ready: document.fonts.ready,
  frame(t) {
    for (const p of dots) {
      const x = p.fx * 1920 + Math.sin(t * .13 + p.ph) * 9;
      const y = p.fy * 1080 + Math.cos(t * .09 + p.ph) * 6;
      p.el.style.width = p.el.style.height = p.r * 2 + 'px';
      p.el.style.transform = `translate(${x}px,${y}px)`;
      p.el.style.opacity = .28 + .30 * (1 + Math.sin(t * p.sp + p.ph)) / 2;
    }
    const g = mulberry32(9000 + (t * 30 | 0));
    for (let i = 0; i < u32.length; i++) { const v = (g() * 255) | 0; u32[i] = (0x14 << 24) | (v << 16) | (v << 8) | v; }
    gctx.putImageData(gbuf, 0, 0);
  }
};
</script></body></html>
