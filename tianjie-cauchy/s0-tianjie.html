<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="shared.css">
<style>
  .beam{left:890px;top:0;width:140px;height:1000px;opacity:0;
    background:linear-gradient(180deg,rgba(255,215,106,0),rgba(255,215,106,.15) 35%,rgba(255,215,106,.04));
    filter:blur(3px);}
  .plaque{left:580px;top:180px;width:760px;text-align:center;padding:40px 0;
    border:3px solid var(--gold);border-radius:20px;opacity:0;
    background:linear-gradient(180deg,rgba(232,182,76,.13),rgba(232,182,76,.03));
    box-shadow:0 0 70px rgba(232,182,76,.28),inset 0 0 34px rgba(232,182,76,.1);}
  .plaque .t{font-size:118px;letter-spacing:.2em;color:var(--gold-hi);}
  .ring{border:3px solid var(--gold-hi);border-radius:50%;opacity:0;}
  .step{position:absolute;border:1px solid var(--line);border-radius:18px;background:var(--panel);opacity:0;}
  .step .tt{font-size:32px;color:var(--muted);margin:20px 32px 8px;}
  .step .ff{font-size:33px;margin:0 32px;}
  .nrow{position:absolute;left:0;width:100%;text-align:center;font-size:44px;opacity:0;color:var(--gold-hi);}
  .nrow .yr{color:var(--muted);font-size:30px;}
  .nrow .cap{color:var(--muted);font-size:24px;margin-left:20px;}
</style>
</head>
<body>
  <div id="rise" class="abs"></div>
  <div class="abs beam" id="beam"></div>
  <div class="abs ring" id="ring1"></div>
  <div class="abs ring" id="ring2"></div>
  <div id="burstHost" class="abs"></div>
  <div class="abs plaque" id="plaque"><div class="kai t">天阶公式</div></div>

  <div class="abs step" id="st1" style="left:150px;top:830px;width:480px;height:150px">
    <div class="tt">凡阶</div><div class="ff fx muted">a²+b² ≥ 2ab &nbsp;·&nbsp; √(ab) ≤ (a+b)/2</div>
  </div>
  <div class="abs step" id="st2" style="left:690px;top:780px;width:480px;height:150px">
    <div class="tt">地阶</div><div class="ff fx muted">H ≤ G ≤ A ≤ Q &nbsp;·&nbsp; |a+b| ≤ |a|+|b|</div>
  </div>
  <div class="abs step" id="st3" style="left:1250px;top:560px;width:560px;height:400px;border-color:var(--gold-dim)">
    <div class="tt" style="color:var(--gold)">天阶</div>
    <div id="slotq" class="kai" style="font-size:130px;color:var(--gold);opacity:0;text-align:center;margin-top:6px">？</div>
    <div class="abs nrow fx" id="n1" style="top:100px">Cauchy <span class="yr">· 1821</span><span class="cap">数列形态</span></div>
    <div class="abs nrow fx" id="n2" style="top:200px">Bunyakovsky <span class="yr">· 1859</span><span class="cap">积分形态</span></div>
    <div class="abs nrow fx" id="n3" style="top:300px">Schwarz <span class="yr">· 1888</span><span class="cap">内积形态</span></div>
  </div>

  <div id="mform" class="fx abs" style="left:410px;top:390px;width:1100px;text-align:center;font-size:62px;opacity:0">
    <span class="sym">(</span><span class="sym">Σ</span><span class="sym gold">a</span><sub class="sym gold">i</sub><span class="sym cyan">b</span><sub class="sym cyan">i</sub><span class="sym">)</span><sup class="sym">2</sup>
    <span class="sym" style="margin:0 .12em">≤</span>
    <span class="sym">(</span><span class="sym">Σ</span><span class="sym gold">a</span><sub class="sym gold">i</sub><sup class="sym gold">2</sup><span class="sym">)</span>
    <span class="sym">(</span><span class="sym">Σ</span><span class="sym cyan">b</span><sub class="sym cyan">i</sub><sup class="sym cyan">2</sup><span class="sym">)</span>
  </div>

  <div id="flash" class="abs" style="inset:0;background:#fff;opacity:0"></div>
  <div class="vign"></div>
<script src="shared.js"></script>
<script>
var F = window.F;
var $ = function (i) { return document.getElementById(i); };
var rise = F.makeRise($('rise'), 960, 260, 700, 34, 11, 'rgba(255,215,106,.9)');
var burst = F.makeBurst($('burstHost'), 960, 390, 30, 7, 'rgba(255,215,106,.95)', 420);
function ringFx(el, t, t0, size) {
  var u = F.seg(t, t0, t0 + .9), s = F.lerp(80, size, F.eoc(u));
  el.style.width = el.style.height = s + 'px';
  el.style.left = (960 - s / 2) + 'px';
  el.style.top = (390 - s / 2) + 'px';
  el.style.opacity = (u > 0 && u < 1) ? (1 - u) * .8 : 0;
}
function stepIn(el, t, t0) {
  var u = F.seg(t, t0, t0 + .7);
  el.style.opacity = u;
  el.style.transform = 'translateY(' + (1 - F.eoc(u)) * 46 + 'px)';
}
function nameIn(el, t, t0, from) {
  var u = F.eic(F.seg(t, t0, t0 + .8));
  el.style.opacity = F.seg(t, t0, t0 + .3);
  el.style.transform = 'translateX(' + from * (1 - u) + 'px)';
}
window.film = {
  duration: 12,
  frame: function (t) {
    rise.update(t);
    $('rise').style.opacity = F.seg(t, .2, 1.4) * (1 - .85 * F.seg(t, 10, 11));
    $('beam').style.opacity = .9 * F.seg(t, .1, 1.2) * (1 - .6 * F.seg(t, 10, 11));
    /* plaque descends 1.2-2.4, overshoot landing */
    var pu = F.eob(F.seg(t, 1.2, 2.4));
    var mg = F.seg(t, 10.0, 10.6);
    $('plaque').style.opacity = F.seg(t, 1.2, 1.5);
    $('plaque').style.transform = 'translateY(' + (-560 * (1 - pu) - 70 * mg) + 'px)';
    $('flash').style.opacity = .22 * F.seg(t, 2.32, 2.4) * (1 - F.seg(t, 2.4, 2.95));
    ringFx($('ring1'), t, 2.4, 760);
    ringFx($('ring2'), t, 2.55, 1020);
    burst.update(t, 2.4, 1.0);
    /* ladder */
    stepIn($('st1'), t, 2.9);
    stepIn($('st2'), t, 3.25);
    stepIn($('st3'), t, 3.6);
    var dim = 1 - .72 * F.seg(t, 10.0, 10.6);
    $('st1').style.opacity *= dim; $('st2').style.opacity *= dim;
    $('slotq').style.opacity = F.seg(t, 4.0, 4.4) * (1 - F.seg(t, 4.7, 5.0));
    nameIn($('n1'), t, 4.7, -620);
    nameIn($('n2'), t, 5.95, 620);
    nameIn($('n3'), t, 7.2, -620);
    /* merge: golden pulse on the tier step */
    var pulse = .5 + .5 * Math.sin((t - 10) * 5);
    $('st3').style.boxShadow = t > 10
      ? '0 0 ' + (30 + 40 * pulse) + 'px rgba(232,182,76,' + (.2 + .2 * pulse) + ')'
      : 'none';
    /* main formula */
    $('mform').style.opacity = F.seg(t, 10.15, 10.45);
    F.reveal($('mform'), t, 10.15, .06, .25);
  }
};
</script>
</body>
</html>
