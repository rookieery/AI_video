/* ================= 工具 ================= */
function mulberry32(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const clamp01=x=>Math.min(1,Math.max(0,x));
const lerp=(a,b,u)=>a+(b-a)*u;
const remap=(t,a,b)=>clamp01((t-a)/(b-a));
const ease={
  linear:u=>u,
  smooth:u=>u*u*(3-2*u),
  inCubic:u=>u*u*u,
  outCubic:u=>1-Math.pow(1-u,3),
  inOutCubic:u=>u<.5?4*u*u*u:1-Math.pow(-2*u+2,3)/2,
  outQuart:u=>1-Math.pow(1-u,4),
  inQuad:u=>u*u,
  outBack:(u,s=1.25)=>{const c=s+1,p=u-1;return 1+c*p*p*p+s*p*p},
};
// 分段线性包络：[[t,v],...]
function env(t,stops){if(t<=stops[0][0])return stops[0][1];for(let i=0;i<stops.length-1;i++){const[t0,v0]=stops[i],[t1,v1]=stops[i+1];if(t<=t1)return v0+(v1-v0)*(t-t0)/(t1-t0)}return stops[stops.length-1][1]}
const DEG=Math.PI/180;
// '#RRGGBB' → 'rgba(r,g,b,a)'（贴图绘制用）
const rgba=(hex,a)=>{const n=parseInt(hex.slice(1),16);return `rgba(${n>>16&255},${n>>8&255},${n&255},${a})`};
// 故障脉冲包络（确定性）：t 落在 [a,b] 内给出 0→1→0
const burst=(t,a,b)=>t<a||t>b?0:Math.sin(Math.PI*(t-a)/(b-a));
// 封面呼吸相位：周期 1.6s，1.6–2.2 加速到 1.0s（闭式积分，无状态）
function breathPhase(t){
  if(t<1.6) return 2*Math.PI*t/1.6;
  const e=2.2; const ph=2*Math.PI+2*Math.PI*Math.log(1.6/(3.2-Math.min(t,e-1e-6)));
  return t<e?ph:2*Math.PI+2*Math.PI*Math.log(1.6/1.0);
}
// 绯红漩涡转速 0.2→1.2 rad/s（积分）
function vortexAngle(t){ return t<2.2 ? 0.2*t+t*t/4.4 : (0.2*2.2+2.2*2.2/4.4)+1.2*(t-2.2); }

{

// 赛博后处理：扫描线 / 色差 / 故障错位（强度为 0 时与原版逐像素一致）
const postPass=new ShaderPass({
  uniforms:{tDiffuse:{value:null},uRes:{value:new THREE.Vector2(1920,1080)},
    uScan:{value:COL.scan},uChroma:{value:COL.chroma},uGlitch:{value:0}},
  vertexShader:`varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}`,
  fragmentShader:`uniform sampler2D tDiffuse;uniform vec2 uRes;uniform float uScan,uChroma,uGlitch;
    varying vec2 vUv;
    void main(){
      vec2 uv=vUv;
      // 行块水平错位（uGlitch 为 0 时完全不生效）
      float row=floor(uv.y*54.0);
      float h=fract(sin(row*91.7+uGlitch*13.0)*43758.5453);
      uv.x+=(step(0.91,h)-0.5)*2.0*0.0024*uGlitch;
      vec2 d=uv-0.5;
      vec3 col;
      col.r=texture2D(tDiffuse,uv+d*uChroma*0.001).r;
      col.g=texture2D(tDiffuse,uv).g;
      col.b=texture2D(tDiffuse,uv-d*uChroma*0.001).b;
      float sl=0.5+0.5*sin(uv.y*uRes.y*2.0943951);
      col*=1.0-uScan*0.22*sl;
      gl_FragColor=vec4(col,1.0);
    }`
});
composer.addPass(postPass);

// 书皮：漆器底 + 电路/点阵 + 边框；withBase=false 时输出透明底（玻璃封面用）
function makeCoverTex(withBase){const c=cnv(512,704),x=c.getContext('2d');
  if(withBase){
    const g=x.createLinearGradient(0,0,0,704);
    g.addColorStop(0,COL.coverTop);g.addColorStop(.5,COL.coverMid);g.addColorStop(1,COL.coverBot);
    x.fillStyle=g;x.fillRect(0,0,512,704);
  }
  if(COL.coverCircuit){
    // PCB 地纹网格（整幅细线，任何镜头距离都读得出"电路板"）
    x.strokeStyle=COL.coverGrid;x.lineWidth=1;
    for(let gx=22;gx<492;gx+=48){x.beginPath();x.moveTo(gx,22);x.lineTo(gx,682);x.stroke()}
    for(let gy=22;gy<690;gy+=48){x.beginPath();x.moveTo(22,gy);x.lineTo(490,gy);x.stroke()}
    // 电路走线（正交折线 + 焊点），避开中央漩涡区，带霓虹辉光
    const r=mulberry32(77);
    x.strokeStyle=COL.coverMesh;x.fillStyle=COL.coverMesh;
    x.save();x.lineWidth=3.2;x.shadowColor=COL.coverBorder1;x.shadowBlur=10;
    for(let n=0;n<52;n++){
      let px=34+r()*444,py=34+r()*636;
      const pts=[[px,py]];let ok=Math.hypot(px-256,py-352)>150;
      for(let s=0;s<4;s++){
        const horiz=s%2===0,len=24+r()*66,dir=r()<.5?-1:1;
        px+=horiz?dir*len:0;py+=horiz?0:dir*len;
        pts.push([px,py]);
        if(Math.hypot(px-256,py-352)<150)ok=false;
      }
      if(!ok||px<26||px>486||py<26||py>678)continue;
      x.beginPath();x.moveTo(pts[0][0],pts[0][1]);
      for(let q=1;q<pts.length;q++)x.lineTo(pts[q][0],pts[q][1]);
      x.stroke();
      const e=pts[pts.length-1];x.fillRect(e[0]-3.5,e[1]-3.5,7,7);
    }
    x.restore();
    // 芯片块（小 IC 轮廓，散布在漩涡外）
    const rc=mulberry32(131);
    x.strokeStyle=COL.coverBorder1;x.lineWidth=1.6;x.fillStyle=COL.coverMesh;
    for(let n=0;n<7;n++){
      const px=44+rc()*424,py=44+rc()*612;
      if(Math.hypot(px-256,py-352)<190)continue;
      const w=16+rc()*22,h=10+rc()*12;
      x.strokeRect(px-w/2,py-h/2,w,h);
      for(let p=-1;p<=1;p++)x.fillRect(px+p*5-1,py-h/2-4,2,3);
    }
    // 漩涡外环：虚线仪表盘
    x.strokeStyle=COL.coverBorder2;x.lineWidth=1.6;
    x.setLineDash([7,9]);
    x.beginPath();x.arc(256,352,168,0,7);x.stroke();
    x.setLineDash([]);
  }else{
    // 菱形点阵（避开中央漩涡区）
    x.strokeStyle=COL.coverMesh;x.lineWidth=1.6;
    const step=42;
    for(let iy=2;iy<704/step-1;iy++)for(let ix=2;ix<512/step-1;ix++){
      const px=ix*step,py=iy*step,d=Math.hypot(px-256,py-352);
      if(d<150||d>330)continue;
      const s=7+2*Math.sin(ix*1.7+iy*2.3);
      x.beginPath();x.moveTo(px,py-s);x.lineTo(px+s,py);x.lineTo(px,py+s);x.lineTo(px-s,py);x.closePath();x.stroke();
    }
  }
  // 双线边框（外框带霓虹辉光）
  x.save();x.shadowColor=COL.coverBorder1;x.shadowBlur=12;
  x.strokeStyle=COL.coverBorder1;x.lineWidth=3;x.strokeRect(22,22,468,660);
  x.restore();
  x.strokeStyle=COL.coverBorder2;x.lineWidth=1.5;x.strokeRect(34,34,444,636);
  return tex(c)}

// 每颗棋子的能量焰（程序化，透明底；blending=Additive）
function makeFlameTex(i){
  const S=256,c=cnv(S,S),x=c.getContext('2d'),R=mulberry32(900+i*37),cx=128,cy=128;
  const kind=BKC.flame;
  x.globalCompositeOperation='lighter';x.lineCap='round';
  const arc=(rad,a0,span,dir,lw,col,blur,wob)=>{
    x.strokeStyle=col;x.lineWidth=lw;x.shadowColor=col;x.shadowBlur=blur;
    x.beginPath();
    for(let q=0;q<=24;q++){
      const u=q/24,ang=a0+dir*span*u;
      const rr=rad+(wob?wob*(0.55+0.45*Math.sin(u*9))*Math.sin(u*Math.PI):0);
      const px=cx+Math.cos(ang)*rr,py=cy+Math.sin(ang)*rr;
      q?x.lineTo(px,py):x.moveTo(px,py);
    }
    x.stroke();
  };
  if(kind==='plasma'){
    const TAU=Math.PI*2;
    // 柔光底：石缘一圈红色能量雾
    const rg=x.createRadialGradient(cx,cy,44,cx,cy,122);
    rg.addColorStop(0,'rgba(0,0,0,0)');rg.addColorStop(.34,rgba(COL.crimson,.20));
    rg.addColorStop(.62,rgba(COL.crimson,.09));rg.addColorStop(1,'rgba(0,0,0,0)');
    x.fillStyle=rg;x.beginPath();x.arc(cx,cy,122,0,TAU);x.fill();
    // 宽焰 / 主焰 / 亮焰 / 青高光：长弧旋绕，留出缺口，避免糊成一圈
    for(let n=0;n<8;n++)arc(58+R()*10,R()*TAU,1.2+R()*1.4,R()<.5?1:-1,10+R()*8,rgba(COL.crimson,.12),24,16);
    for(let n=0;n<14;n++)arc(54+R()*14,R()*TAU,0.9+R()*1.2,R()<.5?1:-1,3.5+R()*4,rgba(COL.crimson,.30),11,9);
    for(let n=0;n<9;n++)arc(58+R()*10,R()*TAU,0.5+R()*.9,R()<.5?1:-1,1.5+R()*1.4,rgba(COL.crimsonHi,.38),6,5);
    for(let n=0;n<5;n++)arc(62+R()*10,R()*TAU,0.4+R()*.5,R()<.5?1:-1,1.1+R()*.8,rgba(COL.goldHi,.36),5,4);
    // 向外火舌（切向甩出，二次曲线）
    for(let n=0;n<12;n++){
      const a=R()*TAU,r0=64+R()*10,r1=r0+8+R()*22,bend=(R()-.5)*1.1;
      x.strokeStyle=rgba(n%3?COL.crimsonHi:COL.gold,.18);
      x.lineWidth=1.2+R()*1.3;x.shadowColor=COL.crimsonHi;x.shadowBlur=7;
      const p0=[cx+Math.cos(a)*r0,cy+Math.sin(a)*r0];
      const p1=[cx+Math.cos(a+bend)*((r0+r1)/2),cy+Math.sin(a+bend)*((r0+r1)/2)];
      const p2=[cx+Math.cos(a+bend*1.6)*r1,cy+Math.sin(a+bend*1.6)*r1];
      x.beginPath();x.moveTo(p0[0],p0[1]);x.quadraticCurveTo(p1[0],p1[1],p2[0],p2[1]);x.stroke();
    }
  }else if(kind==='vector'){
    for(let n=0;n<6;n++)arc(52+R()*6,n*Math.PI/3+R()*.4,1.0+R()*.5,1,1.6,rgba(COL.gold,.75),8,3);
    for(let n=0;n<4;n++)arc(62+R()*10,R()*Math.PI*2,0.6+R()*.6,-1,1.2,rgba(COL.crimsonHi,.8),7,2);
    for(let n=0;n<12;n++){
      const a=R()*Math.PI*2,rr=74+R()*20;
      x.fillStyle=rgba(COL.goldHi,.8);x.shadowColor=COL.gold;x.shadowBlur=6;
      x.beginPath();x.arc(cx+Math.cos(a)*rr,cy+Math.sin(a)*rr,1.6+R()*1.4,0,7);x.fill();
    }
  }else{ // spark：玻璃刻印的细碎迸发
    for(let n=0;n<30;n++){
      const a=R()*Math.PI*2,r0=48+R()*6,r1=r0+3+R()*15;
      x.strokeStyle=n%4?rgba(COL.crimsonHi,.48):rgba(COL.gold,.6);
      x.lineWidth=n%4?1.1:1.5;x.shadowColor=COL.crimsonHi;x.shadowBlur=2;
      x.beginPath();x.moveTo(cx+Math.cos(a)*r0,cy+Math.sin(a)*r0);x.lineTo(cx+Math.cos(a)*r1,cy+Math.sin(a)*r1);x.stroke();
    }
    x.setLineDash([5,7]);
    for(let n=0;n<2;n++){
      x.strokeStyle=rgba(COL.crimsonHi,.35);x.lineWidth=1.4;
      x.beginPath();x.arc(cx,cy,70+n*7,0,7);x.stroke();
    }
    x.setLineDash([]);
  }
  return tex(c);
}

function cardBaseTex(kind,hero,stones){
  const c=cnv(512,512),x=c.getContext('2d');
  const bd=kind==='gold'?COL.gold:COL.crimson, bh=kind==='gold'?COL.goldHi:COL.crimsonHi;
  const P=(gx,gy)=>[256+gx*106.667,256-gy*106.667];
  // 玻璃底 + 冷边菲涅尔
  const rr=(x0,y0,w,h,r)=>{x.beginPath();x.roundRect(x0,y0,w,h,r)};
  rr(14,14,484,484,34);x.fillStyle=COL.cardGlass;x.fill();
  rr(20,20,472,472,28);x.strokeStyle=COL.cardLine1;x.lineWidth=3;x.stroke();
  rr(26,26,460,460,24);x.strokeStyle=COL.cardLine2;x.lineWidth=6;x.stroke();
  // 描边（主）+ 外辉
  rr(14,14,484,484,34);x.strokeStyle=bd;x.lineWidth=9;x.stroke();
  rr(14,14,484,484,34);x.strokeStyle=rgba(bh,.33);
  x.lineWidth=20;x.stroke();
  if(COL.cardTicks){
    // HUD 四角括号（赛博版）
    x.strokeStyle=rgba(bd,.85);x.lineWidth=7;const a=44,b=44,L=56;
    x.beginPath();
    x.moveTo(a,b+L);x.lineTo(a,b);x.lineTo(a+L,b);
    x.moveTo(512-a-L,b);x.lineTo(512-a,b);x.lineTo(512-a,b+L);
    x.moveTo(a,512-b-L);x.lineTo(a,512-b);x.lineTo(a+L,512-b);
    x.moveTo(512-a-L,512-b);x.lineTo(512-a,512-b);x.lineTo(512-a,512-b-L);
    x.stroke();
  }
  if(!hero){
    // 迷你 5×5 网格：α0.55，外框略亮
    x.strokeStyle=rgba(COL.grid,.55);x.lineWidth=3;
    for(let i=-2;i<=2;i++){
      const a=P(i,-2),b=P(i,2);x.beginPath();x.moveTo(a[0],a[1]);x.lineTo(b[0],b[1]);x.stroke();
      const d=P(-2,i),e=P(2,i);x.beginPath();x.moveTo(d[0],d[1]);x.lineTo(e[0],e[1]);x.stroke();
    }
    x.strokeStyle=rgba(COL.goldHi,.85);x.lineWidth=4.5;
    const f1=P(-2,-2),f2=P(2,-2),f3=P(2,2),f4=P(-2,2);
    x.beginPath();x.moveTo(f1[0],f1[1]);x.lineTo(f2[0],f2[1]);x.lineTo(f3[0],f3[1]);x.lineTo(f4[0],f4[1]);x.closePath();x.stroke();
    // 天元小菱形（层序在棋子之下）
    x.save();x.translate(256,256);x.strokeStyle=rgba(COL.goldHi,.8);x.lineWidth=3;
    x.beginPath();x.moveTo(0,-8);x.lineTo(5.5,0);x.lineTo(0,8);x.lineTo(-5.5,0);x.closePath();x.stroke();x.restore();
  }
  // 三子软影（α0.3）
  for(const st of stones){const p=P(st[0],st[1]);
    const g=x.createRadialGradient(p[0]+4,p[1]+6,3,p[0]+4,p[1]+6,46);
    g.addColorStop(0,'rgba(0,0,0,.34)');g.addColorStop(1,'rgba(0,0,0,0)');

  if(!hero){
    // 棋子（黑1 白2 黑3；直径≈0.78 格距）
    for(const st of stones)drawStone2D(x,P(st[0],st[1])[0],P(st[0],st[1])[1],41,st[2]==='w');
  }
  return tex(c)}
function drawStone2D(x,px,py,r,white){

// 经典 CR 基（端点精确：u=0→k1，u=1→k2）
const crSeg=(p0,p1,p2,p3,u)=>{const u2=u*u,u3=u2*u;
  return 0.5*(2*p1+(-p0+p2)*u+(2*p0-5*p1+4*p2-p3)*u2+(-p0+3*p1-3*p2+p3)*u3)};
const _cp=new THREE.Vector3(),_cl=new THREE.Vector3();
function camAt(t){
  let i=0;while(i<CK.length-2&&t>CK[i+1].t)i++;
  const k0=CK[Math.max(0,i-1)],k1=CK[i],k2=CK[i+1],k3=CK[Math.min(CK.length-1,i+2)];
  const u=ease.smooth(remap(t,k1.t,k2.t));
  for(let a=0;a<3;a++){
    _cp.setComponent(a,crSeg(k0.p[a],k1.p[a],k2.p[a],k3.p[a],u));
    _cl.setComponent(a,crSeg(k0.l[a],k1.l[a],k2.l[a],k3.l[a],u));
  }
  camera.position.copy(_cp);camera.lookAt(_cl);
}

function buildStrips(segs,plane){
  const hw=0.0048,pos=[],idx=[];let n=0;
  for(const s of segs){
    let x1,y1,x2,y2;
    if(plane==='xy'){x1=s.x1;y1=s.y1;x2=s.x2;y2=s.y2}
    else{x1=s.x1;y1=-s.y1;x2=s.x2;y2=-s.y2}   // 盘面：gy → world -z
    const cx=(x1+x2)/2,cy=(y1+y2)/2;
    const dx=Math.abs(x2-x1),dy=Math.abs(y2-y1);
    const hx=dx>1e-9?dx/2+hw:hw, hy=dy>1e-9?dy/2+hw:hw;
    const zz=plane==='xy'?0.002:0.0012;
    if(plane==='xy'){
      pos.push(cx-hx,cy-hy,zz, cx+hx,cy-hy,zz, cx+hx,cy+hy,zz, cx-hx,cy+hy,zz);
    }else{
      // 绕序保证法线 +Y（顶视可见）
      pos.push(cx-hx,zz,cy-hy, cx-hx,zz,cy+hy, cx+hx,zz,cy+hy, cx+hx,zz,cy-hy);
    }
    idx.push(n,n+1,n+2,n,n+2,n+3);n+=4;
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));

}

function particleSys(N,gen){
  const p0=new Float32Array(N*3),v=new Float32Array(N*3),t0=new Float32Array(N),
        life=new Float32Array(N),siz=new Float32Array(N),col=new Float32Array(N*3),curv=new Float32Array(N);
  for(let i=0;i<N;i++){const d=gen(i);p0.set(d.p,i*3);v.set(d.v,i*3);t0[i]=d.t0;life[i]=d.life;siz[i]=d.size;col.set(d.c,i*3);curv[i]=d.curv}
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.BufferAttribute(p0,3));
  g.setAttribute('aVel',new THREE.BufferAttribute(v,3));
  g.setAttribute('aT0',new THREE.BufferAttribute(t0,1));
  g.setAttribute('aLife',new THREE.BufferAttribute(life,1));
  g.setAttribute('aSize',new THREE.BufferAttribute(siz,1));
  g.setAttribute('aColor',new THREE.BufferAttribute(col,3));
  g.setAttribute('aCurv',new THREE.BufferAttribute(curv,1));
  const m=new THREE.ShaderMaterial({
    uniforms:{uTime:{value:-1}},
    vertexShader:`attribute vec3 aVel,aColor;attribute float aT0,aLife,aSize,aCurv;
      uniform float uTime;varying vec3 vC;varying float vA;
      void main(){float tau=uTime-aT0;float ok=step(0.0,tau)*step(tau,aLife);
        float k=clamp(tau/aLife,0.0,1.0);vC=aColor;vA=ok*(1.0-k);
        vec3 p=position+aVel*tau*(1.0-aCurv*k);
        vec4 mv=modelViewMatrix*vec4(p,1.0);
        gl_PointSize=aSize*(85.0/max(0.5,-mv.z))*(0.45+0.55*(1.0-k));
        gl_Position=projectionMatrix*mv;}`,
    fragmentShader:`varying vec3 vC;varying float vA;
      void main(){float d=length(gl_PointCoord-0.5);
        float a=smoothstep(0.5,0.1,d)*vA;if(a<0.012)discard;
        gl_FragColor=vec4(vC*1.6,a);}`,
    transparent:true,depthWrite:false,blending:THREE.AdditiveBlending});
  const pts=new THREE.Points(g,m);scene.add(pts);return m;
}

      const p=0.5+0.5*Math.sin(bph-2*Math.PI*rs.ph/1.6);
      rs.ring.scale.setScalar(1+0.16*p);
      rs.ring.material.emissiveIntensity=(0.18+0.55*p)*heat;
      rs.rim.material.opacity=(BKC.stones==='wire'?.28:.14)*(0.6+0.8*p);
    }
    // 封面脉冲两次（2.2–2.6）
    pulseGlow.material.opacity=(t>=2.2&&t<2.4?Math.sin(Math.PI*(t-2.2)/0.2)*0.58:0)+(t>=2.4&&t<2.6?Math.sin(Math.PI*(t-2.4)/0.2)*0.46:0);
    // 书脊金线蔓延
    spineA.material.opacity=0.9*ease.outCubic(remap(t,2.2,2.35));
    spineB.material.opacity=0.9*ease.outCubic(remap(t,2.3,2.5));
    // 书页缝白金辉光（3.0 主峰）
    const pg=Math.pow(Math.sin(Math.PI*remap(t,2.8,3.35)),2);
    pageGlow.material.opacity=pg*0.72;
    pageGlow.scale.set(1+pg*0.15,1+pg*0.10,1);
    pageHalo.material.opacity=pg*0.16;
    pageHalo.scale.setScalar(1+pg*0.35);
  }

  /* --- S3 光柱/亮核 → 6.4 淡出 --- */
  {
    const h=2.6*ease.outCubic(remap(t,3.25,3.7));
    const fade=1-remap(t,5.9,6.35);
    colGroup.visible=h>0.01&&fade>0.01;
    if(colGroup.visible){
      colA.scale.set(1,Math.max(h,0.001),1);colA.position.y=h/2;colA.material.opacity=0.5*fade;
      colB.scale.set(1,Math.max(h,0.001),1);colB.position.y=h/2;colB.material.opacity=0.14*fade;
      const pulse=1+0.18*Math.sin(2*Math.PI*t/0.5);
      core.scale.setScalar(pulse);
      core.position.y=h*0.99;coreGlow.position.y=h*0.99;
      core.material.opacity=fade;coreGlow.material.opacity=0.85*fade;
      colLight.intensity=3.5*fade;
    }else colLight.intensity=0;
  }

  /* --- S6 波前与大盘 --- */
  const wr=waveR(t);
  const waveActive=t>=WAVE_T0&&t<11.55;
  waveRing.visible=waveGlow.visible=waveActive;
  if(waveActive){
    const r=wr+0.012,o=0.9*(1-remap(t,11.35,11.55));
    setSquare(wavePts,r);waveGeo.attributes.position.needsUpdate=true;
    waveRing.material.opacity=o;waveGlow.material.opacity=o*0.3;
    setSquare(waveGlow.geometry.attributes.position.array,r+0.05);
    waveGlow.geometry.attributes.position.needsUpdate=true;
  }
  boardBase.material.uniforms.uOp.value=ease.outCubic(remap(t,9.5,9.8));
  boardBase.material.uniforms.uR.value=wr+0.07;
  for(const rm of ringMeshes){
    const tCross=kCross(rm.k);                    // 波前到达环 k 的时刻
    const d={N:0,E:0.0125,S:0.025,W:0.0375}[rm.side];
    const a=remap(t,tCross+0.05+d,tCross+0.10+d); // 波后 0.05s 内凝出（0.05s 淡入）
    rm.mat.opacity=a*(COL.neonFrame?0.62:0.8);
    rm.mat.color.copy(rm.bright).lerp(rm.gold,a); // 亮起 → 沉为暗金
  }
  // 四角星位（±4,±4）：波前扫过时凝出
  {const tc=kCross(4)+0.05,a=remap(t,tc,tc+0.10);
   starMarks.forEach(m=>{m.material.opacity=a*(0.85+0.15*Math.sin(2*Math.PI*t/2.2))})}
  boardFrame.material.opacity=COL.neonFrame?0:0.8*ease.outCubic(remap(t,11.5,11.85));
  // 霓虹圆角边框（仅赛博风格）：11.3 后凝出
  if(COL.neonFrame){
    boardNeon.visible=t>11.28;
    boardNeon.material.opacity=0.9*ease.outCubic(remap(t,11.3,11.75));
  }else boardNeon.visible=false;
  // 波前扫过棋子：弹亮 0.1s（三子最大环半径 ≈1.5）
  const stoneFlash=Math.max(0,1-Math.abs(t-(WAVE_T0+0.10))/0.1)*Math.sign(wr>1.4*S);
  whiteMat.emissiveIntensity=COL.whiteEmInt+0.9*Math.max(0,stoneFlash);
  blackMat.emissive.setRGB(COL.blackEm[0],COL.blackEm[1],COL.blackEm[2]);
  blackMat.emissiveIntensity=COL.blackEmInt*(1+1.6*Math.max(0,stoneFlash));
  if(stoneFlash>0){blackMat.emissive.setRGB(COL.blackEm[0]+0.35*stoneFlash,COL.blackEm[1]+0.30*stoneFlash,COL.blackEm[2]+0.26*stoneFlash)}
  // 天元终式微光呼吸一次（11.5–12.0）
  tyGlow.material.opacity=0.75*Math.sin(Math.PI*remap(t,11.5,11.95));
  tyGlow.scale.setScalar(0.22+0.16*remap(t,11.5,11.95));

  /* --- S4 黑洞 --- */
  {
    const open=ease.outQuart(remap(t,6.4,6.7))*(1-ease.inCubic(remap(t,8.0,8.2)));
    hole.visible=open>0.001;
    hole.scale.setScalar(Math.max(open,0.001));
    if(hole.visible){
      accretion.rotation.z=-2.4*t;
      photonRing.material.opacity=0.55*open;
      lensRing.material.opacity=0.12*open*(1+0.3*Math.sin(2*Math.PI*t/0.9));
      holeLight.intensity=2.4*open;
    }else holeLight.intensity=0;
  }

  /* --- 26 卡状态机 --- */
  updateCards(t);

  /* --- 扫光 --- */
  updateSweeps(t);

  /* --- 粒子 --- */
  trailSys.uniforms.uTime.value=t;
  debrisSys.uniforms.uTime.value=t;
  dustSys.uniforms.uTime.value=t;

  /* --- Bloom 呼吸 + 暗角 + 赛博后处理 --- */
  bloom.strength=COL.bloomStrength*env(t,[[0,1],[1.6,1],[2.2,1.171],[2.8,1.057],[3.0,1.171],[3.5,1.143],[4.2,1],[6.4,1],[6.7,1.2],[7.6,1.029],[9.5,1.029],[10.1,1.171],[10.8,1],[11.5,1.071],[12,1.114]]);
  vigEl.style.opacity=(COL.vigBase+(COL.vigEnd-COL.vigBase)*ease.inOutCubic(remap(t,11.5,12))).toFixed(3);
  postPass.uniforms.uGlitch.value=COL.glitch*(burst(t,6.40,6.50)+burst(t,11.46,11.56));

  composer.render();
}
const vigEl=document.getElementById('vig');
// 波前到达环 k 的时刻（k=3..7）：r(t) 越过 kS 即 waveEnd(k-3)
function kCross(k){return waveEnd(k-3)}
function setSquare(arr,r){
  const v=[[-r,-r],[r,-r],[r,r],[-r,r]];
  for(let i=0;i<4;i++){arr[i*3]=v[i][0];arr[i*3+1]=0.001;arr[i*3+2]=v[i][1]}
}

/* --- 卡片：飞行 / 待命 / 淘汰 / 英雄轨迹 --- */
// 还原拉丝顶点（跨时刻无残留）
function restoreVerts(c){if(c.stretched){c.geo.attributes.position.array.set(c.baseVerts);c.geo.attributes.position.needsUpdate=true;c.stretched=false}}
function updateCards(t){
  for(const c of cards){
    const p=t-c.tFly;
    if(p<0){c.grp.visible=false;continue}
    c.grp.visible=true;
    const tE=elimAt(c.def.set,c.def.j);
    const elimP=t-tE;
    let pos=c.base.clone(),quat=_q1.identity(),scale=1,opacity=1;

    if(elimP>0&&!c.hero){                      // —— 淘汰：翻面→变暗→拉丝→螺旋吸入
      if(elimP>0.5){c.grp.visible=false;continue}
      const flip=Math.PI*ease.outCubic(remap(elimP,0,0.15));
      quat.setFromAxisAngle(_v1.set(0,1,0),flip);
      const dark=1-0.72*Math.min(1,elimP/0.25);
      c.mat.color.setScalar(dark);
      const q=ease.inQuad(remap(elimP,0.15,0.5));
      const r=ARC_R*(1-q),a=c.angA*DEG+2.2*q;
      pos.set(r*Math.cos(a),r*Math.sin(a),0);
      scale=1-0.9*q;opacity=1-q;
      stretchVerts(c,pos,quat,ease.inQuad(remap(elimP,0.10,0.25)));
    }else if(p<1){                             // —— 螺旋+贝塞尔飞行（0.55s，错峰 70ms）
      // 螺旋发生在 XY 屏面：亮核(0,2.55,0) → 弧位 (R cosA, R sinA, 0)，easeOutBack 过冲回弹
      const u=clamp01(p/0.55);
      const ue=ease.outBack(u), k=ease.outCubic(u);
      const r=Math.max(0.02,ARC_R*ue), a=c.angA*DEG+2.3*(1-ease.inOutCubic(u));
      pos.set(r*Math.cos(a), r*Math.sin(a)+2.55*(1-k), 0.12*Math.sin(Math.PI*u));
      // 姿态：飞行自旋 → 末段并入弧位切线微倾 12°
      const spin=_q2.setFromAxisAngle(_v1.set(0,0,1),(1-u)*2.4*Math.sign(c.ph-3.14));
      quat.copy(slotQuat(c.angA)).premultiply(spin);
      quat.slerp(slotQuat(c.angA),ease.smooth(remap(u,0.55,1)));
      scale=lerp(0.5,1,ease.outCubic(u));
      c.mat.color.setScalar(1);                    // 无残留：每帧复位
      restoreVerts(c);
    }else{                                     // —— 落位待命 / 英雄专属轨迹
      const fl=0.035*Math.sin(2*Math.PI*t/1.9+c.ph)+0.012*Math.sin(2*Math.PI*t/1.1+c.ph2);
      if(c.hero){
        // S4 后段移向阵前中央 → S5 飞向镜头 → 定格呼吸 → 溶解
        if(t<8.2)pos=c.base.clone().lerp(new THREE.Vector3(0,0.25,1.1),ease.inOutCubic(remap(t,7.3,8.2)));
        else pos=new THREE.Vector3(0,0.25,1.1).lerp(HERO_S5,ease.inOutCubic(remap(t,8.2,8.8)));
        if(t>=8.8){pos.copy(HERO_S5);
          const br=1+0.022*Math.sin(2*Math.PI*(t-8.8)/0.8);scale=br;}
        // 姿态：+Z 朝向相机（Matrix4.lookAt(eye,target)：非相机物体需 eye=目标点）
        _m1.lookAt(camera.position,pos,_v1.set(0,1,0));quat.setFromRotationMatrix(_m1);
      }else{
        pos=c.base.clone();pos.y+=fl;
        quat.copy(slotQuat(c.angA));
        quat.multiply(_q2.setFromAxisAngle(_v1.set(0,0,1),1.5*DEG*Math.sin(2*Math.PI*t/2.3+c.ph)));
        // 6.0–6.4 扫光掠过时闪亮（其余时间恒为 1，避免跨帧残留）
        const sw=sweepAngleNear(c.angA,t);
        c.mat.color.setScalar(sw!==null?1+1.2*sw:1);
        restoreVerts(c);
      }
    }
    c.grp.position.copy(pos);
    c.grp.quaternion.copy(quat);
    c.grp.scale.setScalar(scale);
    c.mat.opacity=opacity;
    // 英雄卡溶解（9.2–9.5）：描边与卡底淡出，网格与三子留原位
    if(c.hero){
      c.mat.opacity=opacity*(1-remap(t,9.2,9.5));
      c.grp.visible=t<9.55;
    }
  }
  /* --- 英雄迷你盘：随卡 → 落盘（Rx(−90°)，格距与坐标零变化，§6） --- */
  if(t<9.2){
    miniBoard.position.copy(heroCard.grp.position);
    miniBoard.quaternion.copy(heroCard.grp.quaternion);
    miniBoard.scale.copy(heroCard.grp.scale);
  }else{
    const e=ease.inOutCubic(remap(t,9.2,9.5));
    _v1.set(1,0,0);_q2.setFromAxisAngle(_v1,-RAD2);           // 卡面(上=+y) → 盘面(上=−z)
    miniBoard.position.lerpVectors(heroCard.grp.position,new THREE.Vector3(0,0,0),e);
    miniBoard.quaternion.slerpQuaternions(heroCard.grp.quaternion,_q2,e);
    miniBoard.scale.setScalar(1);                              // 禁用整体缩放（§6 铁律）
  }
  miniBoard.visible=t>=heroCard.tFly;
  miniGrid.material.opacity=0.62+0.18*ease.smooth(remap(t,9.2,9.35));
  miniTY.material.opacity=Math.min(1,remap(t,9.25,9.45));      // 天元菱标随卡面菱形交接
  // 盘面三子软影：溶解期从卡面阴影接手（先更新世界矩阵，避免一帧滞后）
  miniBoard.updateMatrixWorld(true);
  const shOp=remap(t,9.2,9.5);
  boardShadows.forEach((m,i)=>{miniStones[i].getWorldPosition(_v2);
    m.visible=shOp>0;m.material.opacity=0.62*shOp;
    m.position.set(_v2.x,0.0025,_v2.z)});
}
// 弧位姿态：面向镜头 + 绕弧切线微倾 12°
const _slotQ={};
function slotQuat(aDeg){
  const key=Math.round(aDeg*10);
  if(!_slotQ[key]){
    const a=aDeg*DEG,tg=_v1.set(-Math.sin(a),Math.cos(a),0).normalize();
    _slotQ[key]=new THREE.Quaternion().setFromAxisAngle(tg,12*DEG);
  }
  return _slotQ[key];
}
// 顶点引力拉丝：网格顶点向黑洞方向位移渐增
function stretchVerts(c,pos,quat,amt){
  if(!c.geo)return;
  if(amt<=0){if(c.stretched){c.geo.attributes.position.array.set(c.baseVerts);c.geo.attributes.position.needsUpdate=true;c.stretched=false}return}
  c.stretched=true;
  const dir=_v1.set(0,0,0).sub(pos).normalize().applyQuaternion(quat.clone().invert());
  const arr=c.geo.attributes.position.array,base=c.baseVerts;
  for(let i=0;i<arr.length;i+=3){
    const r=Math.hypot(base[i],base[i+1]);
    const pull=amt*0.22*(0.3+r*1.6);
    arr[i]=base[i]+dir.x*pull;arr[i+1]=base[i+1]+dir.y*pull;arr[i+2]=base[i+2];
  }
  c.geo.attributes.position.needsUpdate=true;
}
// 6.0–6.4 弧扫：返回卡片角度处的闪光强度（无扫光返回 null）
function sweepAngleNear(cardAng,t){
  if(t<6.0||t>6.42)return null;
  const prog=ease.inOutCubic(remap(t,6.0,6.4));
  const targets=[[210,135],[60,135],[240,315],[30,315]];
  let best=0;
  for(const[a0,a1]of targets){
    const sa=lerp(a0,a1,prog);
    let d=Math.abs(cardAng-sa);d=Math.min(d,360-d);
    best=Math.max(best,Math.exp(-(d*d)/(2*10*10)));
  }
  return best>0.05?best:null;
}
function updateSweeps(t){
  if(t>=6.0&&t<=6.42){
    const prog=ease.inOutCubic(remap(t,6.0,6.4));
    const sp=[[210,135],[60,135],[240,315],[30,315]];
    arcSweeps.forEach((s,i)=>{
      const a=lerp(sp[i][0],sp[i][1],prog)*DEG;
      s.visible=true;s.position.set((ARC_R+0.06)*Math.cos(a),(ARC_R+0.06)*Math.sin(a),0.1);
      s.material.opacity=0.9*(1-remap(t,6.3,6.42));
      s.scale.setScalar(0.2+0.08*Math.sin(2*Math.PI*t/0.3+i));
    });
  }else arcSweeps.forEach(s=>s.visible=false);
  // S5 卡框金描边扫光一周（8.85–9.2）
  if(t>=8.85&&t<=9.22){
    const u=remap(t,8.85,9.2);
    const pp=roundedPerim(u*perimLen());
    rimSweepA.visible=rimSweepB.visible=true;
    placeOnRim(rimSweepA,pp,0.004,0.16);
    placeOnRim(rimSweepB,Math.max(0,pp-0.09),0.004,0.10);
    rimSweepA.material.opacity=rimSweepB.material.opacity=0.95*(1-remap(t,9.15,9.22));
  }else rimSweepA.visible=rimSweepB.visible=false;
}
// 圆角方框周长参数化（卡框 0.72、圆角 0.05）：自上边左端顺时针
function perimLen(){return 4*(CARD-0.1)+2*Math.PI*0.05}
function roundedPerim(p){
  const st=CARD-0.1,arc=2*Math.PI*0.05/4;
  const seg=[st,arc,st,arc,st,arc,st,arc];let acc=0;
  for(let i=0;i<8;i++){if(p<=acc+seg[i]){const u=(p-acc)/seg[i];return[i,u]}acc+=seg[i]}
  return[7,1];
}
function placeOnRim(spr,p,dz,scale){
  // E=半边长 0.36；c=角弧圆心坐标 0.31；r=0.05
  const E=CARD/2,r=0.05,c=E-r;
  const[i,u]=roundedPerim(p);let x,y;
  switch(i){
    case 0:x=-c+u*2*c;y=E;break;                                   // 上
    case 1:{const a=Math.PI/2*(1-u);x=c+r*Math.cos(a);y=c+r*Math.sin(a);break} // 右上角
    case 2:x=E;y=c-u*2*c;break;                                     // 右
    case 3:{const a=-Math.PI/2*u;x=c+r*Math.cos(a);y=-c+r*Math.sin(a);break}  // 右下角
    case 4:x=c-u*2*c;y=-E;break;                                    // 下
    case 5:{const a=-Math.PI/2-Math.PI/2*u;x=-c+r*Math.cos(a);y=-c+r*Math.sin(a);break} // 左下角
    case 6:x=-E;y=-c+u*2*c;break;                                   // 左
    case 7:{const a=Math.PI-Math.PI/2*u;x=-c+r*Math.cos(a);y=c+r*Math.sin(a);break}      // 左上角
  }
  _v1.set(x,y,dz).applyQuaternion(heroCard.grp.quaternion).add(heroCard.grp.position);
  spr.position.copy(_v1);spr.scale.setScalar(scale);
}

/* ================= window.film ================= */
window.film={
  width:1920,height:1080,duration:DUR,
  ready:Promise.resolve(),
  frame
};
