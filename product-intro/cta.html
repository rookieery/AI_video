<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="shared.css">
<style>
  .bloom {
    position: absolute; left: 960px; top: 540px; width: 1000px; height: 1000px;
    border-radius: 50%; transform: translate(-50%, -50%);
    background: radial-gradient(circle, rgba(255, 179, 92, 0.2), rgba(139, 92, 246, 0.08) 45%, transparent 70%);
    opacity: 0;
  }
  .mark { position: absolute; left: 905px; top: 240px; width: 110px; height: 100px; }
  .mark path, .mark line {
    fill: none; stroke: var(--amber); stroke-width: 7; stroke-linecap: round;
    stroke-dasharray: 100; stroke-dashoffset: 100;
  }
  .brand2 {
    position: absolute; left: 0; right: 0; top: 388px; margin: 0; text-align: center;
    font-size: 44px; font-weight: 300; letter-spacing: 0.58em; text-indent: 0.58em;
    color: var(--ink-dim); opacity: 0;
  }
  .headline {
    position: absolute; left: 0; right: 0; top: 500px; margin: 0; text-align: center;
    font-size: 88px; font-weight: 300; letter-spacing: 0.14em; text-indent: 0.14em;
  }
  .headline span { display: inline-block; opacity: 0; }
  .pill {
    position: absolute; left: 0; right: 0; top: 712px; margin: 0 auto; width: fit-content;
    padding: 22px 58px; border-radius: 999px; font-size: 30px; font-weight: 300;
    letter-spacing: 0.12em; color: var(--ink);
    border: 1px solid rgba(255, 179, 92, 0.45);
    background: rgba(255, 179, 92, 0.06);
    box-shadow: 0 0 44px rgba(255, 179, 92, 0.18);
    opacity: 0;
  }
  .pill .dot { margin: 0 18px; color: var(--ink-faint); }
</style>
</head>
<body>
<div class="stage">
  <div class="bloom" id="bloom"></div>
  <svg class="mark" viewBox="0 0 120 110">
    <path d="M 22 78 A 38 38 0 1 1 98 78" pathLength="100"/>
    <line x1="10" y1="92" x2="110" y2="92" pathLength="100"/>
  </svg>
  <h1 class="brand2">LUMEN</h1>
  <h2 class="headline"><span>即</span><span>刻</span><span>点</span><span>亮</span><span>你</span><span>的</span><span>生</span><span>活</span></h2>
  <div class="pill">lumen.example.com<span class="dot">·</span>限量首发</div>
  <div class="vignette"></div>
  <div class="fadeblack" id="fb"></div>
</div>
<script type="module">
const clamp01 = x => Math.max(0, Math.min(1, x));
const seg = (t, a, l) => clamp01((t - a) / l);
const outCubic = x => 1 - Math.pow(1 - x, 3);
const outBack = x => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };

const bloom = document.getElementById('bloom');
const markBits = [...document.querySelectorAll('.mark path, .mark line')];
const brand2 = document.querySelector('.brand2');
const chars = [...document.querySelectorAll('.headline span')];
const pill = document.querySelector('.pill');
const fb = document.getElementById('fb');

window.film = {
  duration: 2.5,
  frame(t) {
    const bp = outBack(seg(t, 0.05, 0.95));
    bloom.style.transform = `translate(-50%, -50%) scale(${bp})`;
    bloom.style.opacity = clamp01(seg(t, 0.05, 0.4)) * 0.9;

    markBits.forEach((el, i) => {
      el.style.strokeDashoffset = 100 * (1 - outCubic(seg(t, 0.15 + i * 0.2, 0.55)));
    });

    brand2.style.opacity = outCubic(seg(t, 0.45, 0.5));

    chars.forEach((el, i) => {
      const p = outCubic(seg(t, 0.75 + i * 0.09, 0.5));
      el.style.opacity = p;
      el.style.transform = `translateY(${(1 - p) * 40}px)`;
      el.style.filter = `blur(${(1 - p) * 8}px)`;
    });

    const pp = outBack(seg(t, 1.5, 0.55));
    pill.style.opacity = clamp01(seg(t, 1.5, 0.25));
    pill.style.transform = `scale(${0.92 + 0.08 * pp})`;

    fb.style.opacity = 1 - clamp01(t / 0.4);
  }
};
</script>
</body>
</html>
