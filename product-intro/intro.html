<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="shared.css">
<style>
  .spark {
    position: absolute; left: 960px; top: 385px; width: 26px; height: 26px;
    border-radius: 50%; background: var(--brand-grad);
    transform: translate(-50%, -50%);
    box-shadow: 0 0 60px 12px rgba(255, 150, 92, 0.55), 0 0 160px 60px rgba(139, 92, 246, 0.25);
    opacity: 0;
  }
  .glow {
    position: absolute; left: 960px; top: 385px; width: 560px; height: 560px;
    border-radius: 50%; transform: translate(-50%, -50%);
    background: radial-gradient(circle, rgba(255, 179, 92, 0.16), transparent 65%);
  }
  .ripple {
    position: absolute; left: 960px; top: 385px; width: 300px; height: 300px;
    border-radius: 50%; transform: translate(-50%, -50%);
    border: 1.5px solid rgba(245, 242, 234, 0.5);
    opacity: 0;
  }
  .brand {
    position: absolute; left: 0; right: 0; top: 468px; margin: 0;
    text-align: center; font-size: 148px; font-weight: 200;
    letter-spacing: 0.24em; text-indent: 0.24em; color: var(--ink);
  }
  .brand span { display: inline-block; opacity: 0; }
  .tagline {
    position: absolute; left: 0; right: 0; top: 700px; margin: 0;
    text-align: center; font-size: 34px; font-weight: 300;
    color: var(--ink-dim); letter-spacing: 0.38em; text-indent: 0.38em;
    opacity: 0;
  }
</style>
</head>
<body>
<div class="stage">
  <div class="glow"></div>
  <div class="ripple r1"></div>
  <div class="ripple r2"></div>
  <div class="spark"></div>
  <h1 class="brand"><span>L</span><span>U</span><span>M</span><span>E</span><span>N</span></h1>
  <p class="tagline">光,随心而动</p>
  <div class="vignette"></div>
  <div class="fadeblack" id="fb"></div>
</div>
<script type="module">
const clamp01 = x => Math.max(0, Math.min(1, x));
const seg = (t, a, l) => clamp01((t - a) / l);
const outCubic = x => 1 - Math.pow(1 - x, 3);
const outBack = x => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };

const spark = document.querySelector('.spark');
const glow = document.querySelector('.glow');
const ripples = [...document.querySelectorAll('.ripple')];
const letters = [...document.querySelectorAll('.brand span')];
const tagline = document.querySelector('.tagline');
const fb = document.getElementById('fb');

window.film = {
  duration: 3,
  frame(t) {
    const s = outBack(seg(t, 0.05, 0.75));
    spark.style.transform = `translate(-50%, -50%) scale(${s})`;
    spark.style.opacity = clamp01(s);
    glow.style.opacity = 0.4 + 0.2 * Math.sin(t * 2.4);

    ripples.forEach((r, i) => {
      const p = outCubic(seg(t, 0.55 + i * 0.55, 1.8));
      r.style.transform = `translate(-50%, -50%) scale(${0.15 + p * 1.15})`;
      r.style.opacity = (1 - p) * 0.45;
    });

    letters.forEach((el, i) => {
      const p = outCubic(seg(t, 0.8 + i * 0.13, 0.6));
      el.style.opacity = p;
      el.style.transform = `translateY(${(1 - p) * 46}px)`;
      el.style.filter = `blur(${(1 - p) * 10}px)`;
    });

    const tp = outCubic(seg(t, 2.0, 0.7));
    tagline.style.opacity = tp;
    tagline.style.letterSpacing = `${0.65 - 0.27 * tp}em`;

    fb.style.opacity = 1 - clamp01(t / 0.4);
  }
};
</script>
</body>
</html>
