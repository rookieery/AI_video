<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="shared.css">
<style>
  .lamp {
    position: absolute; left: 830px; top: 170px; width: 940px; height: 793px;
  }
  .lamp path, .lamp line {
    fill: none; stroke: rgba(245, 242, 234, 0.9); stroke-width: 3.5; stroke-linecap: round;
  }
  #dome, #base, #stem { stroke-dasharray: 100; stroke-dashoffset: 100; }
  #bulb {
    fill: url(#bulbGrad); filter: blur(26px); opacity: 0;
    transform-origin: 450px 470px;
  }
  .dust { position: absolute; inset: 0; }
  .dust i {
    position: absolute; width: 4px; height: 4px; border-radius: 50%;
    background: rgba(255, 210, 160, 0.8); opacity: 0;
  }
  .copy { position: absolute; left: 150px; top: 395px; }
  .copy h2 { margin: 0; font-size: 76px; font-weight: 300; letter-spacing: 0.06em; }
  .copy h2 span { display: inline-block; opacity: 0; }
  .copy p {
    margin: 34px 0 0; font-size: 26px; font-weight: 300;
    color: var(--ink-dim); letter-spacing: 0.28em; opacity: 0;
  }
</style>
</head>
<body>
<div class="stage">
  <div class="dust" id="dust"></div>
  <svg class="lamp" viewBox="0 0 900 760">
    <defs>
      <radialGradient id="bulbGrad" cx="50%" cy="55%" r="60%">
        <stop offset="0%" stop-color="#ffd9a0"/>
        <stop offset="45%" stop-color="#ff9d5c" stop-opacity="0.85"/>
        <stop offset="100%" stop-color="#c56b9c" stop-opacity="0"/>
      </radialGradient>
    </defs>
    <ellipse id="bulb" cx="450" cy="470" rx="165" ry="120"/>
    <path id="dome" d="M 160 600 A 290 290 0 1 1 740 600" pathLength="100"/>
    <line id="stem" x1="450" y1="600" x2="450" y2="640" pathLength="100"/>
    <path id="base" d="M 100 640 L 800 640" pathLength="100"/>
  </svg>
  <div class="copy">
    <h2><span>一盏,</span><span>懂你的灯</span></h2>
    <p>航空级哑光铝 · 手工装配</p>
  </div>
  <div class="vignette"></div>
  <div class="fadeblack" id="fb"></div>
</div>
<script type="module">
const clamp01 = x => Math.max(0, Math.min(1, x));
const seg = (t, a, l) => clamp01((t - a) / l);
const outCubic = x => 1 - Math.pow(1 - x, 3);
const inOutCubic = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const rnd = i => { const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };

const dome = document.getElementById('dome');
const stem = document.getElementById('stem');
const base = document.getElementById('base');
const bulb = document.getElementById('bulb');
const words = [...document.querySelectorAll('.copy h2 span')];
const caption = document.querySelector('.copy p');
const fb = document.getElementById('fb');

// 尘埃微粒:一次创建,每帧按 t 纯函数定位
const dust = document.getElementById('dust');
const motes = [];
for (let i = 0; i < 16; i++) {
  const el = document.createElement('i');
  dust.appendChild(el);
  motes.push({ el, x: 860 + rnd(i) * 900, y: 200 + rnd(i + 50) * 640, speed: 8 + rnd(i + 99) * 14, alpha: 0.15 + rnd(i + 7) * 0.4 });
}

window.film = {
  duration: 3.5,
  frame(t) {
    dome.style.strokeDashoffset = 100 * (1 - inOutCubic(seg(t, 0.15, 1.35)));
    base.style.strokeDashoffset = 100 * (1 - outCubic(seg(t, 0.75, 0.85)));
    stem.style.strokeDashoffset = 100 * (1 - outCubic(seg(t, 1.0, 0.4)));

    const bo = outCubic(seg(t, 1.35, 0.7));
    bulb.style.opacity = bo * (0.8 + 0.2 * Math.sin(t * 3.1));
    bulb.style.transform = `scale(${0.85 + 0.15 * bo})`;

    words.forEach((el, i) => {
      const p = outCubic(seg(t, 1.9 + i * 0.18, 0.6));
      el.style.opacity = p;
      el.style.transform = `translateY(${(1 - p) * 44}px)`;
    });
    caption.style.opacity = outCubic(seg(t, 2.55, 0.55));

    motes.forEach((m, i) => {
      m.el.style.left = `${m.x + 18 * Math.sin(t * 0.6 + rnd(i) * 6.28)}px`;
      m.el.style.top = `${m.y - t * m.speed}px`;
      m.el.style.opacity = m.alpha * (0.6 + 0.4 * Math.sin(t * 2 + i));
    });

    fb.style.opacity = 1 - clamp01(t / 0.35);
  }
};
</script>
</body>
</html>
