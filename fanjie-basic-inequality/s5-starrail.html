<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="shared.css">
<style>
  #scene{position:absolute;inset:0;transform-origin:1640px 620px;}
  #tiers{position:absolute;inset:0;}
  #stars,#pg{position:absolute;inset:0;}
  #pgBox{position:absolute;left:720px;top:60px;width:480px;height:190px;border:1px solid rgba(232,182,76,.25);
    border-radius:18px;opacity:0;}
  #pgT{position:absolute;left:0;right:0;top:110px;text-align:center;font-size:60px;color:var(--pri);opacity:0;}
  .tier{position:absolute;border-radius:50%;}
  #fan{left:308px;top:608px;width:24px;height:24px;background:rgb(226,229,236);opacity:0;}
  #dij{left:708px;top:611px;width:18px;height:18px;background:var(--sec);opacity:0;}
  #tij{left:1165px;top:605px;width:30px;height:30px;background:var(--pri);opacity:0;}
  .tlab{position:absolute;font-size:26px;color:var(--muted);opacity:0;letter-spacing:.15em;}
  #flab{left:284px;top:668px;} #dlab{left:692px;top:668px;} #tlab{left:1152px;top:668px;color:var(--pri);}
  #f4m{position:absolute;left:170px;top:500px;width:300px;font-size:34px;color:var(--pri-hi);opacity:0;}   /* fx-row 行中心 y=540 */
  #cq{position:absolute;left:960px;top:504px;width:440px;font-size:28px;color:var(--pri-hi);opacity:0;}    /* fx-row 行中心 y=520 */
  #q1{position:absolute;left:704px;top:540px;font-size:36px;color:var(--pri-hi);opacity:0;}
  #q2{position:absolute;left:1736px;top:466px;font-size:36px;color:var(--muted);opacity:0;}
  /* 神阶：上轴——箭头之外 (1700,560)，100px；「?」同款悬于其上（与地阶?同构，双坑竞猜） */
  #shen{position:absolute;left:1700px;top:560px;font-size:100px;color:var(--pri);opacity:0;letter-spacing:.1em;}
  #fin{position:absolute;left:1630px;top:610px;width:20px;height:20px;border-radius:50%;background:var(--pri-hi);opacity:0;}
  #bk{position:absolute;inset:0;background:#05070d;opacity:0;pointer-events:none;z-index:90;}
</style>
</head>
<body>
<div id="scene">
  <div id="stars"></div>
  <svg width="1920" height="1080" style="position:absolute;inset:0;">
    <defs>
      <linearGradient id="lg" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="var(--ter)"/><stop offset="1" stop-color="var(--pri-hi)"/>
      </linearGradient>
    </defs>
    <line id="ax" x1="120" y1="620" x2="120" y2="620" stroke="var(--line)" stroke-width="3" opacity="0"/>
    <polygon id="arrow" points="0,0 0,0 0,0" fill="var(--line)" opacity="0"/>
    <line id="link" x1="320" y1="555" x2="320" y2="555" stroke="url(#lg)" stroke-width="3.5"
          stroke-dasharray="12 9" opacity="0"/>
    <circle id="fran" fill="none" stroke="var(--pri-hi)" stroke-width="3" opacity="0"/>
  </svg>

  <div id="pg"><div id="pgBox"></div><div id="pgT" class="kai">基本不等式</div></div>

  <div id="tiers">
    <div id="fan" class="tier"></div><div id="dij" class="tier"></div><div id="tij" class="tier"></div>
    <div id="flab" class="tlab">凡阶</div><div id="dlab" class="tlab">地阶</div><div id="tlab" class="tlab">天阶</div>
    <div id="f4m" class="fx fx-row"><span class="surd">√(ab)</span> ≤ <span class="frac"><span class="top">a+b</span><span class="bot">2</span></span></div>
    <div id="cq" class="fx fx-row">(Σa<sub>i</sub>b<sub>i</sub>)² ≤ Σa<sub>i</sub>²·Σb<sub>i</sub>²</div>
    <div id="q1" class="fx kai">?</div>
    <div id="q2" class="fx kai">?</div>
    <div id="shen" class="kai">神</div>
  </div>
</div>
<!-- 方案A「半圆残影」：S2 核心图景在消失点重生（O=(1640,620) r=170，弧顶 (1640,450)；残影无标签，纯形） -->
<svg width="1920" height="1080" style="position:absolute;inset:0;">
  <g id="bloom">
    <line id="brad" x1="1640" y1="620" x2="1640" y2="620" stroke="var(--pri)" stroke-width="4" opacity="0"/>
    <path id="baL" d="M 1640 450 A 170 170 0 0 0 1470 620" fill="none" stroke="var(--white)"
          stroke-width="3" opacity=".45" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100"/>
    <path id="baR" d="M 1640 450 A 170 170 0 0 1 1810 620" fill="none" stroke="var(--white)"
          stroke-width="3" opacity=".45" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100"/>
    <line id="bdiaL" x1="1640" y1="620" x2="1640" y2="620" stroke="var(--pri)" stroke-width="4" opacity="0"/>
    <line id="bdiaR" x1="1640" y1="620" x2="1640" y2="620" stroke="var(--pri)" stroke-width="4" opacity="0"/>
    <circle id="bpd" r="7.5" cx="1588" cy="620" fill="var(--white)" opacity="0" style="filter:drop-shadow(0 0 3px rgba(244,246,250,.9));"/>
    <line id="bhl" x1="1588" y1="620" x2="1588" y2="620" stroke="var(--ter)" stroke-width="4" opacity="0"/>
  </g>
  <circle id="bring1" fill="none" stroke="var(--pri-hi)" stroke-width="3" opacity="0"/>
  <circle id="bring2" fill="none" stroke="var(--pri-hi)" stroke-width="2" opacity="0"/>
</svg>
<div id="fin"></div>
<div id="bloomHost" style="position:absolute;inset:0;"></div>
<div id="bk"></div>
<div class="vign"></div>
<div class="cap">还有两阶，留给谁？</div>

<script src="shared.js"></script>
<script type="module">
var $ = function (id) { return document.getElementById(id); };
/* 星尘 60 颗（种子 2023，与柯西 P6 模板同源）：各频闪烁 0.5–1.3Hz */
var r2 = F.rng(2023), stars = [];
for (var i = 0; i < 60; i++) {
  var d = document.createElement('div'); d.className = 'p';
  d.style.background = 'rgba(244,246,250,.9)';
  $('stars').appendChild(d);
  stars.push({ e: d, x: 60 + r2() * 1800, y: 40 + r2() * 940, s: 1.4 + r2() * 2.4, f: .5 + r2() * .8, p: r2() * 6.28 });
}

var burst2 = F.makeBurst($('bloomHost'), 1640, 620, 32, 2025, 'rgba(255,215,106,.95)', 210);

window.film = {
  duration: 12,
  frame: function (t) {
    /* 0–0.5 转场：S4 收官牌组压暗收缩渐隐（影子态）；星尘亮起；数轴自 x120 展开（eoq） */
    var pgu = F.seg(t, 0, 1.0);
    $('pgBox').style.opacity = F.lerp(.3, 0, pgu);
    $('pgBox').style.transform = 'scale(.85)';
    $('pgT').style.opacity = F.lerp(.25, 0, pgu);
    $('pgT').style.transform = 'scale(.85)';
    var stU = F.eoc(F.seg(t, 0, .5));
    for (var i = 0; i < stars.length; i++) {
      var s = stars[i], tw = .4 + .45 * (0.5 + 0.5 * Math.sin(2 * Math.PI * s.f * t + s.p));
      s.e.style.opacity = stU * tw;
      s.e.style.width = s.e.style.height = s.s + 'px';
      s.e.style.left = s.x + 'px'; s.e.style.top = s.y + 'px';
    }
    var axU = F.eoq(F.seg(t, 0, 1.0));
    $('ax').setAttribute('x2', F.lerp(120, 1600, axU));
    $('ax').style.opacity = .9;
    $('arrow').setAttribute('points', '1600,612 1626,620 1600,628');
    $('arrow').style.opacity = axU;

    /* 0.5–1.5 凡阶点亮：灰白→暖白金 #ffd76a 色温过渡（0.8s eic）+ 冲击环 120px + 小字 */
    var fanU = F.eic(F.seg(t, .5, 1.3));
    var cr = Math.round(F.lerp(226, 255, fanU)), cg = Math.round(F.lerp(229, 215, fanU)), cb = Math.round(F.lerp(236, 106, fanU));
    var fan = $('fan');
    fan.style.opacity = Math.min(1, F.seg(t, .3, .5) * 2);
    fan.style.background = 'rgb(' + cr + ',' + cg + ',' + cb + ')';
    fan.style.boxShadow = '0 0 ' + (10 + 26 * fanU) + 'px rgba(255,215,106,' + (.25 + .5 * fanU) + ')';
    var rk = F.eoc(F.seg(t, .9, 1.4));
    $('fran').setAttribute('cx', 320); $('fran').setAttribute('cy', 620);
    $('fran').setAttribute('r', 120 * rk); $('fran').style.opacity = (1 - rk) * .8;
    $('flab').style.opacity = F.eoc(F.seg(t, 1.0, 1.4));
    $('flab').style.color = 'var(--pri-hi)';
    /* F4 缩影常驻：1.1–1.7 亮起，随后降至 20% 透明驻留（展示，本片持有） */
    var f4u = F.eic(F.seg(t, 1.1, 1.7));
    $('f4m').style.opacity = f4u * F.lerp(1, .2, F.seg(t, 1.9, 2.4));

    /* 1.5–3.5 金色虚线"影子"连线（橙金渐变虚线=影子语义）：描边 eoq + 2.5 起 dash-offset 流动【H15】 */
    var lkU = F.eoq(F.seg(t, 1.5, 2.5));
    var lk = $('link');
    lk.setAttribute('x2', F.lerp(320, 1180, lkU));
    lk.setAttribute('y2', F.lerp(555, 600, lkU));
    lk.setAttribute('stroke-dashoffset', t > 2.5 ? -24 * (t - 2.5) : 0);
    lk.style.opacity = .85 * F.seg(t, 1.5, 1.8);
    /* 2.0（影片 1:12）天阶金点亮起 + 柯西式一帧闪回（亮 0.6s 即降 20% 透明驻留） */
    var tu = F.eob(F.seg(t, 2.0, 2.5));
    var fall = F.lerp(1, .45, F.seg(t, 4.0, 4.5));   /* H27 高亮回收：4.0 两阶? 点亮，天阶点/神字金晕同刻回落常规微光 */
    var tij = $('tij');
    tij.style.opacity = tu;
    tij.style.transform = 'scale(' + F.lerp(1.6, 1, tu) + ')';
    tij.style.boxShadow = '0 0 ' + ((8 + 20 * (.5 + .5 * Math.sin(2 * Math.PI * 1.2 * t))) * fall) + 'px rgba(232,182,76,.55)';
    $('tlab').style.opacity = F.eoc(F.seg(t, 2.2, 2.6));
    var cqU = F.eic(F.seg(t, 2.0, 2.6));
    $('cq').style.opacity = cqU * F.lerp(1, .2, F.seg(t, 2.7, 3.2));

    /* 2.5–3.5 地阶竞猜：青点微光呼吸 1.5Hz + 发亮「?」（金晕脉动） */
    var dj = $('dij');
    dj.style.opacity = F.eoc(F.seg(t, 2.5, 2.9));
    dj.style.boxShadow = '0 0 ' + (8 + 16 * (.5 + .5 * Math.sin(2 * Math.PI * 1.5 * t))) + 'px rgba(88,196,212,.5)';
    $('dlab').style.opacity = F.eoc(F.seg(t, 2.7, 3.1));
    var q1u = F.eoc(F.seg(t, 2.9, 3.3));
    var q1 = $('q1');
    q1.style.opacity = q1u;
    q1.style.textShadow = '0 0 ' + (8 + 18 * (.5 + .5 * Math.sin(2 * Math.PI * 1.2 * t))) + 'px rgba(255,215,106,.85)';

    /* 3.0–4.0 神阶竞猜：「神」字金晕浮现（透明度+微缩 0.9→1+呼吸）+ 右下角小「?」脉动一次 */
    var shU = F.eic(F.seg(t, 3.0, 3.7));
    var sh = $('shen');
    sh.style.opacity = shU;
    sh.style.transform = 'scale(' + F.lerp(.9, 1, shU) + ')';
    sh.style.textShadow = '0 0 ' + ((20 + 26 * (.5 + .5 * Math.sin(2 * Math.PI * 1.5 * t))) * fall) + 'px rgba(232,182,76,.5)';
    var q2p = Math.sin(Math.PI * F.seg(t, 3.5, 4.2));
    var q2 = $('q2');
    q2.style.opacity = F.eoc(F.seg(t, 3.5, 3.9)) * .85;
    q2.style.color = q2p > 0 ? 'var(--pri-hi)' : 'var(--muted)';
    q2.style.textShadow = q2p > 0 ? '0 0 ' + (14 * q2p) + 'px rgba(255,215,106,.8)' : '';

    /* 4.0（影片 1:14）两阶「?」同拍再点亮一次（金晕脉冲，不用白闪） */
    var re = Math.sin(Math.PI * F.seg(t, 4.0, 4.5));
    q1.style.transform = 'scale(' + (1 + .4 * re) + ')';
    q2.style.transform = 'scale(' + (1 + .4 * re) + ')';

    /* 5.0–7.3 驻留：星轨整体微漂移 ±2px + 各点呼吸 + 连线流动（dash-offset 滚动【H15】） */
    var drift = t > 5 ? 2 * Math.sin(2 * Math.PI * .1 * (t - 5)) : 0;
    var scene = $('scene');
    scene.style.left = drift + 'px';

    /* 字幕⑤ 1.0–4.0（⑥「围成圆」已删，5.0–7.3 转净驻留） */
    F.capShow(document.querySelector('.cap'), t, 1.0, 4.0);

    /* 7.5–8.6 星点收缩：全场景向消失点 (1640,620) 缩放至 16%，阶位与星尘渐隐（星点沿途吸收） */
    var shu = F.eic(F.seg(t, 7.5, 8.6));
    scene.style.transformOrigin = '1640px 620px';
    scene.style.transform = 'scale(' + F.lerp(1, .16, shu) + ')';
    $('tiers').style.opacity = (1 - .95 * shu) * (1 - F.seg(t, 8.6, 9.0));   /* 残点 8.6 后收净 */
    $('stars').style.opacity = (1 - .9 * shu) * (1 - F.seg(t, 8.6, 9.4));
    var railF = 1 - F.seg(t, 7.5, 8.6);                /* 数轴/箭头/连线同步淡出（残轨让位半圆） */
    $('ax').style.opacity = .9 * railF;
    $('arrow').style.opacity = axU * railF;
    lk.style.opacity = .85 * F.seg(t, 1.5, 1.8) * railF;

    /* ===== 方案A「半圆残影」结尾：S2 图景语言在消失点重生（BGM 收干参照 11.4 起拍） =====
       8.3 终星种子 → 8.6–9.2 半径立起 → 9.2–10.2 弧自顶双向描出 → 9.9–10.4 直径铺开
       → 10.4–11.0 弦于分点升起触弧 → 11.0–11.4 分点滑至圆心（弦与半径重合=取等，转金）
       → 11.4 金环×2+爆发 32 粒 → 11.4–11.9 碎为星尘升腾 → 11.55–12.0 收黑 */
    var fs = F.seg(t, 8.3, 8.6) * (1 - F.seg(t, 8.9, 9.3));
    $('fin').style.opacity = fs * (.65 + .35 * (0.5 + 0.5 * Math.sin(2 * Math.PI * 1.2 * t)));
    $('fin').style.boxShadow = '0 0 26px rgba(255,215,106,.85)';

    var BR = 170, BX = 1640, BY = 620;                  /* 残影圆 O=(1640,620) r=170 */
    var bo = 1 - F.eic(F.seg(t, 11.4, 11.9));          /* 残影碎化升腾退场 */
    $('bloom').style.opacity = bo;
    $('bloom').style.transform = 'translateY(' + (-18 * (1 - bo)) + 'px)';
    var ru = F.eoc(F.seg(t, 8.6, 9.2));
    $('brad').setAttribute('y2', BY - BR * ru);
    $('brad').setAttribute('opacity', ru * .95);
    var au = F.eoq(F.seg(t, 9.2, 10.2));
    $('baL').setAttribute('stroke-dashoffset', 100 - 100 * au);
    $('baR').setAttribute('stroke-dashoffset', 100 - 100 * au);
    var du2 = F.eoc(F.seg(t, 9.9, 10.4));
    $('bdiaL').setAttribute('x2', BX - BR * du2);
    $('bdiaR').setAttribute('x2', BX + BR * du2);
    $('bdiaL').setAttribute('opacity', .95 * du2);
    $('bdiaR').setAttribute('opacity', .95 * du2);
    /* 弦：分点 P 偏左 52px（a 长 b 短）升起触弧；11.0–11.4 滑至圆心，弦长 h=√(ab)→r，重合转金（取等） */
    var slide = F.eic(F.seg(t, 11.0, 11.4));
    var po = -52 * (1 - slide);
    var hh = Math.sqrt(BR * BR - po * po);
    $('bpd').setAttribute('cx', BX + po);
    $('bpd').setAttribute('cy', BY);
    $('bpd').setAttribute('opacity', F.seg(t, 10.3, 10.5) * .95);
    var hu2 = F.eic(F.seg(t, 10.4, 11.0));
    $('bhl').setAttribute('x1', BX + po); $('bhl').setAttribute('x2', BX + po);
    $('bhl').setAttribute('y2', BY - hh * hu2);
    $('bhl').setAttribute('opacity', .95 * hu2);
    $('bhl').setAttribute('stroke', slide > .98 ? 'var(--pri-hi)' : 'var(--ter)');
    /* 取等一搏（金晕脉冲，不用白闪）：双扩散环 + 32 粒金烬（种子 2025） */
    var g1 = F.eoc(F.seg(t, 11.4, 12.15));
    $('bring1').setAttribute('cx', BX); $('bring1').setAttribute('cy', BY);
    $('bring1').setAttribute('r', 240 * g1); $('bring1').setAttribute('opacity', (1 - g1) * .8);
    var g2 = F.eoc(F.seg(t, 11.5, 12.2));
    $('bring2').setAttribute('cx', BX); $('bring2').setAttribute('cy', BY);
    $('bring2').setAttribute('r', 170 * g2); $('bring2').setAttribute('opacity', (1 - g2) * .6);
    burst2.update(t, 11.4, 1.0);

    /* 11.55–12.0 熄灭收黑（H19 结尾豁免；星烬余光入夜） */
    $('bk').style.opacity = F.seg(t, 11.55, 12.0);
  }
};
</script>
</body>
</html>
