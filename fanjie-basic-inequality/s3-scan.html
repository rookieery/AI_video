<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="shared.css">
<style>
  /* 方案C 三拍法庭：拍一 事实（大矩形扫描封顶）→ 拍二 法律（F5 独占）→ 拍三 证据（抛物线压轴登场）→ 判决 */
  #aBig{position:absolute;left:0;right:0;top:118px;text-align:center;font-size:72px;opacity:0;white-space:nowrap;transform-origin:50% 50%;}
  #per{position:absolute;left:0;right:0;top:922px;text-align:center;font-size:28px;color:var(--muted);opacity:0;white-space:nowrap;}
  .xtag{position:absolute;left:1250px;font-size:30px;opacity:0;white-space:nowrap;transform-origin:left center;}
  #f5{position:absolute;left:0;right:0;top:495px;font-size:56px;opacity:0;transform-origin:50% 50%;white-space:nowrap;}
  #f5 .concl{color:var(--pri-hi);}
  #bLab{position:absolute;left:240px;width:120px;top:246px;text-align:center;font-size:22px;color:var(--pri-hi);opacity:0;}
  #sb{left:1480px;top:800px;opacity:0;transform-origin:1660px 900px;}
</style>
</head>
<body>
<svg width="1920" height="1080" style="position:absolute;inset:0;">
  <circle id="ring1" fill="none" stroke="var(--pri-hi)" stroke-width="3" opacity="0"/>
  <circle id="ring2" fill="none" stroke="var(--pri-hi)" stroke-width="2" opacity="0"/>
  <!-- 拍一 主角：周长 40m 的矩形（SVG 描边 = 篱笆展开；36px/单位，中心 (960,555)） -->
  <rect id="sq" x="942" y="213" width="36" height="684" rx="8" pathLength="100"
        fill="rgba(244,246,250,.03)" stroke="var(--white)" stroke-width="4"
        stroke-dasharray="100" stroke-dashoffset="100"/>
  <!-- 拍三 证物：A(w)=w(20−w) 全曲线（轴 y=840，x 360–1500） -->
  <g id="pg">
    <line id="axis" x1="360" y1="840" x2="1500" y2="840" stroke="var(--line)" stroke-width="2" opacity="0"/>
    <path id="curve" fill="none" stroke="var(--pri-hi)" stroke-width="3.5" pathLength="100"
          stroke-dasharray="100" stroke-dashoffset="100" opacity="0"/>
    <path id="gcur" fill="none" stroke="var(--sec)" stroke-width="3" stroke-dasharray="7 6" opacity="0"/>
    <circle id="gd" r="6" fill="var(--sec)" opacity="0"/>
    <text id="g19" class="fx" font-size="26" fill="var(--sec-hi)" text-anchor="end" x="1440" y="876" opacity="0">19</text>
    <g id="pts"></g>
  </g>
</svg>

<div id="aBig" class="fx">A = 19.0 ㎡</div>
<div id="per">篱笆周长 40m ⇒ l + w = 20</div>
<div class="xtag fx" id="xt0" style="top:405px;color:var(--sec-hi);">19×1 = 19</div>
<div class="xtag fx" id="xt1" style="top:472px;color:rgba(244,246,250,.85);">15×5 = 75</div>
<div class="xtag fx" id="xt2" style="top:539px;color:rgba(244,246,250,.85);">12×8 = 96</div>
<div class="xtag fx" id="xt3" style="top:606px;color:var(--pri-hi);">10×10 = 100</div>

<div id="f5" class="fx fx-row"><span class="surd">√(l·w)</span> ≤ <span class="frac"><span class="top">l+w</span><span class="bot">2</span></span> <span data-tok>= 10</span> ⇒ <span class="concl" data-tok>l·w ≤ 100</span></div>
<div id="bLab" class="fx">100㎡</div>

<div id="sb" class="hud">
  <div class="hud-t">记 分 牌</div>
  <div class="fx" id="sbN" style="font-size:44px;color:var(--pri-hi);text-align:center;margin-top:14px;">最大 100㎡</div>
  <div class="fx" style="font-size:26px;color:var(--white);text-align:center;margin-top:16px;">当且仅当 l = w = 10</div>
</div>

<div id="burstHost" style="position:absolute;inset:0;"></div>
<div class="vign"></div>

<script src="shared.js"></script>
<script type="module">
var $ = function (id) { return document.getElementById(id); };
var PU = 36, CX = 960, CY = 555;                            /* 36px/单位，矩形中心 (960,555) */
function box(w) { var W = w * PU, H = (20 - w) * PU; return { x: CX - W / 2, y: CY - H / 2, w: W, h: H }; }
function xOf(w) { return 360 + (w - 1) * (1140 / 18); }     /* w∈[1,19] → x 360–1500 */
function yOf(A) { return 840 - 3.2 * A; }                   /* 轴 y=840，顶点 y=520 */
function AOf(w) { return w * (20 - w); }
function pathD(w0, w1) {
  var d = '', n = 40;
  for (var i = 0; i <= n; i++) {
    var w = F.lerp(w0, w1, i / n);
    d += (i ? 'L' : 'M') + xOf(w).toFixed(1) + ' ' + yOf(AOf(w)).toFixed(1);
  }
  return d;
}
$('curve').setAttribute('d', pathD(1, 19));
$('gcur').setAttribute('d', pathD(10, 19));

/* 拍一 扫描：w 1→10 eic（0.9–5.2），过 5/8 打点时刻数值反解 */
function scanW(t) { return 1 + 9 * F.eic(F.seg(t, .9, 5.2)); }
function crossW(wt) {
  for (var i = 0; i <= 900; i++) { var t = .9 + i * .005; if (scanW(t) >= wt) return t; }
  return 5.2;
}
var PLATES = [
  { id: 'xt0', tm: .9 }, { id: 'xt1', tm: crossW(5) }, { id: 'xt2', tm: crossW(8) }, { id: 'xt3', tm: 5.2 }
];
/* 拍三 证物打点：曲线 9.7–10.5 匀速描绘，过点即弹（与 S2 同套数） */
var PTS = [
  { w: 1, lab: '19×1=19', col: 'var(--sec-hi)', ax: 'start', lx: 368, ly: 876 },
  { w: 5, lab: '15×5=75', col: 'var(--white)', ax: 'middle', lx: 613, ly: 650 },
  { w: 8, lab: '12×8=96', col: 'var(--white)', ax: 'middle', lx: 803, ly: 556 },
  { w: 10, lab: '10×10=100', col: 'var(--pri-hi)', ax: 'middle', lx: 930, ly: 488 }
];
var ptsG = $('pts');
PTS.forEach(function (p) {
  p.tm = 9.7 + .8 * ((p.w - 1) / 18);
  var tk = document.createElementNS('http://www.w3.org/2000/svg', 'line');
  tk.setAttribute('x1', xOf(p.w)); tk.setAttribute('y1', 840); tk.setAttribute('x2', xOf(p.w));
  tk.setAttribute('y2', 856); tk.setAttribute('stroke', 'var(--line)'); tk.setAttribute('stroke-width', '2');
  tk.style.opacity = 0; ptsG.appendChild(tk); p.tk = tk;
  var c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
  c.setAttribute('cx', xOf(p.w)); c.setAttribute('cy', yOf(AOf(p.w))); c.setAttribute('r', p.w === 10 ? 7 : 4.5);
  c.setAttribute('fill', p.col); c.style.opacity = 0; ptsG.appendChild(c); p.ce = c;
  var tx = document.createElementNS('http://www.w3.org/2000/svg', 'text');
  tx.setAttribute('class', 'fx'); tx.setAttribute('font-size', p.w === 10 ? 26 : 24);
  tx.setAttribute('fill', p.col); tx.setAttribute('text-anchor', p.ax);
  tx.setAttribute('x', p.lx); tx.setAttribute('y', p.ly); tx.textContent = p.lab;
  tx.style.opacity = 0; ptsG.appendChild(tx); p.te = tx;
});
var burst = F.makeBurst($('burstHost'), CX, CY, 30, 5, 'rgba(255,215,106,.95)', 300);

window.film = {
  duration: 13,
  frame: function (t) {
    var st = F.eic(F.seg(t, 12.6, 13.0));                    /* 收拍沉降：全台退场黑切 S4 */

    /* ===== 拍一·事实 0–6.2：矩形描边展开→w 扫描→5.2 封顶→6.2 交接缩为证物徽章 ===== */
    var w = t < .9 ? 1 : (t < 5.2 ? scanW(t) : 10);
    var locked = t >= 5.2;
    var shrink = F.eic(F.seg(t, 6.2, 6.9));                  /* 6.2–6.9 缩至左上徽章 (240,200,120²) */
    var bk = box(w);
    var sq = $('sq');
    sq.setAttribute('x', F.lerp(bk.x, 240, shrink));
    sq.setAttribute('y', F.lerp(bk.y, 200, shrink));
    sq.setAttribute('width', F.lerp(bk.w, 120, shrink));
    sq.setAttribute('height', F.lerp(bk.h, 120, shrink));
    sq.setAttribute('rx', F.lerp(8, 12, shrink));
    sq.setAttribute('stroke-dashoffset', 100 - 100 * F.eoq(F.seg(t, .15, .8)));
    sq.setAttribute('stroke', locked ? 'var(--pri-hi)' : 'var(--white)');
    sq.setAttribute('fill', locked ? 'rgba(232,182,76,.16)' : 'rgba(244,246,250,.03)');
    if (locked) sq.setAttribute('fill-opacity', F.eoc(F.seg(t, 5.2, 5.6)));
    sq.style.opacity = 1 - st;
    sq.style.filter = locked
      ? 'drop-shadow(0 0 ' + (16 + 10 * Math.sin(2 * Math.PI * 2 * t)) + 'px rgba(232,182,76,.5))' : '';  /* H15 金晕呼吸 */
    /* 徽章内号 100㎡：交接落位后亮起 */
    $('bLab').style.opacity = F.seg(t, 6.7, 7.0) * (1 - st);
    /* 面积大读数：滚动→封顶翻「100㎡」金晕过冲→交接随拍一退场 */
    var aB = $('aBig');
    var exit1 = 1 - F.seg(t, 6.2, 6.5);
    if (locked) { aB.textContent = '100 ㎡'; aB.style.color = 'var(--pri-hi)';
      aB.style.textShadow = '0 0 ' + (22 + 10 * Math.sin(2 * Math.PI * 2 * t)) + 'px rgba(232,182,76,.55)'; }
    else { aB.textContent = 'A = ' + F.fmt(AOf(w), 1) + ' ㎡'; aB.style.color = 'var(--white)'; aB.style.textShadow = ''; }
    var pop = locked ? F.lerp(1.35, 1, Math.min(1, F.eob(F.seg(t, 5.2, 5.85)))) : 1;
    aB.style.opacity = F.seg(t, .5, .9) * exit1;
    aB.style.transform = 'translateY(' + (-24 * F.seg(t, 6.2, 6.5)) + 'px) scale(' + pop + ')';
    /* 周长约束一行 + 过点名牌列（右侧 19×1/15×5/12×8/10×10——与 S2 同套数） */
    $('per').style.opacity = F.eoc(F.seg(t, .6, 1.0)) * exit1;
    PLATES.forEach(function (p) {
      var pu = F.eoc(F.seg(t, p.tm, p.tm + .3));
      var el = $(p.id);
      el.style.opacity = F.seg(t, p.tm, p.tm + .15) * exit1;
      el.style.transform = 'translateX(' + ((1 - pu) * 28) + 'px)';
    });
    var xt3 = $('xt3');
    if (locked) xt3.style.textShadow = '0 0 18px rgba(255,215,106,.6)';
    /* 5.35 封顶爆发：粒子 30（种子5，不用白闪不盖章）+双扩散环 */
    burst.update(t, 5.35, .9);
    var r1 = F.eoc(F.seg(t, 5.35, 6.2));
    $('ring1').setAttribute('cx', CX); $('ring1').setAttribute('cy', CY);
    $('ring1').setAttribute('r', 60 + 320 * r1); $('ring1').style.opacity = (1 - r1) * .8 * (1 - st);
    var r2 = F.eoc(F.seg(t, 5.5, 6.3));
    $('ring2').setAttribute('cx', CX); $('ring2').setAttribute('cy', CY);
    $('ring2').setAttribute('r', 40 + 220 * r2); $('ring2').style.opacity = (1 - r2) * .6 * (1 - st);

    /* ===== 拍二·法律 6.6–9.0：F5 整式入场独占全帧；9.0–9.6 升顶带缩 0.82 让位拍三 ===== */
    var fu = F.eic(F.seg(t, 6.6, 7.3));
    var rise = F.eic(F.seg(t, 9.0, 9.6));
    var f5 = $('f5');
    f5.style.opacity = fu * F.lerp(1, .72, F.seg(t, 9.6, 10.0)) * (1 - st);
    f5.style.transform = 'translateY(' + ((1 - fu) * 16 - 305 * rise + 50 * st) + 'px) scale(' + F.lerp(1, .82, rise) + ')';
    f5.style.textShadow = '0 0 ' + (10 + 7 * Math.sin(2 * Math.PI * 1.5 * t)) + 'px rgba(232,182,76,.18)';  /* H15 */
    F.token(f5, t, [[7.5, .8], [8.3, .8]]);                 /* 「=10」「l·w≤100」双拍高亮 */

    /* ===== 拍三·证据 9.6–11.0：抛物线首登匀速描绘，四点齐标；10.6 幽灵点自顶点跌回 19 ===== */
    var dim = 1 - .45 * F.seg(t, 11.1, 11.5);               /* H27：判决进场，证物降权 */
    var pg = $('pg');
    pg.style.opacity = dim * (1 - st);
    pg.setAttribute('transform', 'translate(0 ' + (50 * st) + ')');
    $('axis').style.opacity = F.eoc(F.seg(t, 9.6, 9.9));
    $('curve').style.opacity = .92;
    $('curve').setAttribute('stroke-dashoffset', 100 - 100 * F.seg(t, 9.7, 10.5));
    PTS.forEach(function (p) {
      var on = F.seg(t, p.tm + .06, p.tm + .16);
      var pk = 1 + .3 * Math.sin(Math.PI * F.seg(t, p.tm, p.tm + .4));
      p.tk.style.opacity = on * .8;
      p.ce.style.opacity = on * .95;
      p.te.style.opacity = on * (p.w === 10 ? 1 : .85);
      p.te.setAttribute('transform', 'translate(' + p.lx + ' ' + p.ly + ') scale(' + pk + ') translate(' + (-p.lx) + ' ' + (-p.ly) + ')');
    });
    var wg = 10 + 9 * F.eic(F.seg(t, 10.6, 11.0));           /* 过顶即跌：幽灵点沿右支滑回 19 */
    $('gcur').style.opacity = .55 * F.seg(t, 10.6, 10.8);
    $('gd').setAttribute('cx', xOf(wg)); $('gd').setAttribute('cy', yOf(AOf(wg)));
    $('gd').style.opacity = F.seg(t, 10.6, 10.75) * .9;
    var g19u = F.eob(F.seg(t, 11.0, 11.35));
    $('g19').style.opacity = F.seg(t, 11.0, 11.1);
    $('g19').setAttribute('transform', 'translate(1440 876) scale(' + g19u + ') translate(-1440 -876)');

    /* ===== 判决 11.0–13.0：记分牌定格（字幕③已删，沉降黑切 S4） ===== */
    var su = F.eob(F.seg(t, 11.0, 11.6));
    var sb = $('sb');
    sb.style.opacity = su * (1 - st);
    sb.style.transform = 'translateY(' + (50 * st) + 'px) scale(' + F.lerp(.8, 1, su) + ')';
    $('sbN').style.textShadow = '0 0 ' + (12 + 8 * Math.sin(2 * Math.PI * 2 * t)) + 'px rgba(255,215,106,.5)';  /* H15 */
  }
};
</script>
</body>
</html>
