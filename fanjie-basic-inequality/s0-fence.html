<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="shared.css">
<style>
  #sc{position:absolute;inset:0;transform-origin:960px 540px;}
  #cone{position:absolute;left:560px;top:-120px;width:1000px;height:1020px;
    clip-path:polygon(80% 0,97% 0,40% 100%,10% 100%);
    background:linear-gradient(205deg,rgba(244,246,250,.17),rgba(244,246,250,.05) 55%,transparent 78%);
    filter:blur(3px);opacity:0;transform-origin:1000px 900px;}
  /* 双轨篱笆金线：各 800px = 40m（20px/米，与两矩形同尺） */
  .rail{position:absolute;left:560px;height:3px;width:0;
    background:linear-gradient(90deg,var(--pri),var(--pri-hi) 60%,var(--pri));
    box-shadow:0 0 16px rgba(232,182,76,.45);opacity:0;}
  #rail1{top:278px;} #rail2{top:518px;}
  .tk{position:absolute;width:2px;height:12px;opacity:0;background:var(--pri-dim);}
  .tkf{height:20px;background:var(--pri-hi);box-shadow:0 0 8px rgba(255,215,106,.55);}
  .chip40{position:absolute;left:1400px;opacity:0;font-size:30px;color:var(--pri-hi);}
  #chip1{top:236px;} #chip2{top:476px;}
  #fold{position:absolute;inset:0;}
  #st1c{filter:drop-shadow(0 0 9px rgba(88,196,212,.3));}
  .lab{position:absolute;font-size:30px;opacity:0;}
  #n19{position:absolute;left:1215px;top:240px;opacity:0;}
  #n100{position:absolute;left:1215px;top:487px;opacity:0;}
  .num{font-size:44px;letter-spacing:.04em;display:inline-block;transform-origin:50% 50%;}
  #fxHost{position:absolute;inset:0;}
  #starHost,#riseHost{position:absolute;inset:0;}
</style>
</head>
<body>
<div id="sc">
  <div id="starHost"></div>
  <div id="cone"></div>
  <div id="rails">
    <div id="rail1" class="rail"></div>
    <div id="rail2" class="rail"></div>
  </div>
  <div id="chip1" class="chip chip40">40m</div>
  <div id="chip2" class="chip chip40">40m</div>
  <svg id="fold" width="1920" height="1080">
    <g id="g1" style="opacity:0">
      <polygon id="fill1" points="" style="fill:var(--sec);fill-opacity:0"/>
      <polyline id="st1g" points="" fill="none" stroke-width="3.5" stroke-linejoin="round" style="stroke:var(--pri)"/>
      <polyline id="st1c" points="" fill="none" stroke-width="3.5" stroke-linejoin="round" style="stroke:var(--sec);opacity:0"/>
      <circle id="seam1" r="4" cx="0" cy="0" style="fill:var(--sec-hi);opacity:0"/>
    </g>
    <g id="g2" style="opacity:0">
      <polygon id="fill2" points="" style="fill:var(--pri);fill-opacity:0"/>
      <polyline id="st2" points="" fill="none" stroke-width="3.5" stroke-linejoin="round" style="stroke:var(--pri)"/>
      <circle id="seam2" r="4" cx="0" cy="0" style="fill:var(--pri-hi);opacity:0"/>
    </g>
  </svg>
  <span id="lab19" class="lab" style="color:var(--sec-hi);left:960px;top:225px;transform:translateX(-50%)">19</span>
  <span id="lab1" class="lab" style="color:var(--sec-hi);left:1166px;top:263px;font-size:26px">1</span>
  <span id="lab10a" class="lab" style="color:var(--pri-hi);left:845px;top:505px;transform:translateX(-100%)">10</span>
  <span id="lab10b" class="lab" style="color:var(--pri-hi);left:1078px;top:505px">10</span>
  <span id="n19" class="num" style="color:var(--sec-hi);">19㎡</span>
  <span id="n100" class="num" style="color:var(--pri-hi);">100㎡</span>
  <div id="fxHost"></div>
  <div id="riseHost"></div>
</div>
<div class="vign"></div>
<div class="cap">周长同是40米，面积差<span class="k">5倍多</span>？</div>

<script src="shared.js"></script>
<script type="module">
var $ = function (id) { return document.getElementById(id); };
var sc = $('sc'), cone = $('cone'), rail1 = $('rail1'), rail2 = $('rail2'),
    chip1 = $('chip1'), chip2 = $('chip2'), g1 = $('g1'), g2 = $('g2'),
    fill1 = $('fill1'), fill2 = $('fill2'), st1g = $('st1g'), st1c = $('st1c'), st2 = $('st2'),
    seam1 = $('seam1'), seam2 = $('seam2'), starHost = $('starHost'),
    cap = document.querySelector('.cap'), capK = cap.querySelector('.k');

/* 双轨几何：直线态（折点=米刻度 19/20/39 与 10/20/30）→ 矩形态（同尺 20px/单位） */
var L1S = [{x:560,y:280},{x:940,y:280},{x:960,y:280},{x:1340,y:280},{x:1360,y:280}];
var L1F = [{x:770,y:290},{x:1150,y:290},{x:1150,y:270},{x:770,y:270},{x:770,y:290}];   /* 19×1 细缝 */
var L2S = [{x:560,y:520},{x:760,y:520},{x:960,y:520},{x:1160,y:520},{x:1360,y:520}];
var L2F = [{x:860,y:620},{x:1060,y:620},{x:1060,y:420},{x:860,y:420},{x:860,y:620}];   /* 10×10 方块 */

/* 米刻度：5m 小刻 + 折点刻（两轨折叠图纸不同，同线不同命） */
var lanes = [
  { y: 280, folds: [940, 960, 1340], minors: [660, 760, 860, 1060, 1160, 1260] },
  { y: 520, folds: [760, 960, 1160], minors: [660, 860, 1060, 1260] }
];
var ticks = [];
lanes.forEach(function (ln) {
  ln.minors.forEach(function (x) {
    var d = document.createElement('div'); d.className = 'tk';
    d.style.left = x + 'px'; d.style.top = (ln.y - 6) + 'px';
    $('rails').appendChild(d); ticks.push({ e: d, fold: false });
  });
  ln.folds.forEach(function (x) {
    var d = document.createElement('div'); d.className = 'tk tkf';
    d.style.left = x + 'px'; d.style.top = (ln.y - 10) + 'px';
    $('rails').appendChild(d); ticks.push({ e: d, fold: true });
  });
});

/* 星点环境层（种子 3）：各点独立频率闪烁 */
var r3 = F.rng(3), stars = [];
for (var i = 0; i < 26; i++) {
  var d = document.createElement('div'); d.className = 'p';
  d.style.background = 'rgba(244,246,250,.9)';
  starHost.appendChild(d);
  stars.push({ e: d, x: 80 + r3() * 1760, y: 60 + r3() * 380, s: 1.5 + r3() * 2.4, f: .5 + r3() * .8, p: r3() * 6.28 });
}
var rise = F.makeRise($('riseHost'), 960, 620, 320, 16, 3, 'rgba(232,182,76,.8)');

/* 5.8 问题重锤触地配套（氛围层不计主体）：双冲击环 + 金晕爆闪 + 24 粒火花 */
var fxHost = $('fxHost'), rings = [];
[{ d: 0, sz: 420 }, { d: .09, sz: 330 }].forEach(function (cfg) {
  var r = document.createElement('div');
  r.style.cssText = 'position:absolute;left:960px;top:668px;border:3px solid var(--pri-hi);' +
    'border-radius:50%;opacity:0;transform:translate(-50%,-50%);box-shadow:0 0 26px rgba(255,215,106,.35);';
  fxHost.appendChild(r);
  rings.push({ e: r, t0: 6.25 + cfg.d, sz: cfg.sz, s0: 40 - cfg.d * 100 });
});
var bloom = document.createElement('div');
bloom.style.cssText = 'position:absolute;left:960px;top:668px;width:940px;height:340px;border-radius:50%;' +
  'opacity:0;transform:translate(-50%,-50%);background:radial-gradient(closest-side,rgba(255,215,106,.55),rgba(255,215,106,0) 72%);';
fxHost.appendChild(bloom);
var burst = F.makeBurst(fxHost, 960, 664, 24, 7, 'rgba(232,182,76,.95)', 250);

/* 折叠链：5 个折点自直线态逐级（波次 +0.1s）eob 落向矩形态角点；
   过冲按行程限幅 ≤9px（J4 长程 510px 若带满额 10% 过冲会甩出角点 51px、压向字幕带） */
function foldPts (S, Fp, t0, t) {
  var pts = [];
  for (var i = 0; i < 5; i++) {
    var dx = Fp[i].x - S[i].x, dy = Fp[i].y - S[i].y;
    var d = Math.sqrt(dx * dx + dy * dy) || 1;
    var u = F.eob(F.seg(t, t0 + i * .1, t0 + 1.0 + i * .1));
    u = 1 + (u - 1) * Math.min(1, 90 / d);   /* 行程 >90px 的关节过冲等比压缩，全场合 ≤9px */
    pts.push({ x: S[i].x + dx * u, y: S[i].y + dy * u });
  }
  return pts;
}
function ptsStr (p) {
  var s = '';
  for (var i = 0; i < p.length; i++) s += p[i].x.toFixed(1) + ',' + p[i].y.toFixed(1) + ' ';
  return s;
}

window.film = {
  duration: 9,
  frame: function (t) {
    /* 光锥（氛围层，不计主体）：0–0.8 淡入 + 宽度呼吸扩张；5.8–6.6 渐隐 */
    var cu = F.eoc(F.seg(t, 0, .8));
    var breathe = 1 + .05 * Math.sin(2 * Math.PI * .35 * t);
    cone.style.opacity = cu * F.lerp(.85, 0, F.seg(t, 5.8, 6.6));
    cone.style.transform = 'scaleX(' + breathe + ')';

    /* 双金线 0.8–1.0 同刻左→右点亮（各 800px=40m）；
       2.2 折叠启动同刻双线本体降权 0.4 为轨影（H27 交接：折叠即让位）；5.8–6.6 退场 */
    var fu = F.eoq(F.seg(t, .8, 1.0));
    rail1.style.width = rail2.style.width = (800 * fu) + 'px';
    var fw = F.lerp(1, .4, F.seg(t, 2.2, 3.2)) * (1 - F.seg(t, 5.8, 6.6));
    rail1.style.opacity = rail2.style.opacity = .95 * fw;

    /* 米刻度：小刻常驻，折点刻 1.8–2.3 折叠预告脉冲 */
    var tin = F.seg(t, .95, 1.25);
    var pulse = Math.sin(Math.PI * F.seg(t, 1.8, 2.3));
    for (var i = 0; i < ticks.length; i++) {
      var tk = ticks[i];
      tk.e.style.opacity = (tk.fold ? Math.min(1, tin * (.7 + .5 * pulse)) : tin * .8) * fw;
    }

    /* 「40m」chip ×2 同刻上浮 */
    var chu = F.eoc(F.seg(t, .9, 1.2));
    [chip1, chip2].forEach(function (c) {
      c.style.opacity = chu * fw;
      c.style.transform = 'translateY(' + ((1 - chu) * 12) + 'px)';
    });

    /* 双线同步折叠 2.2–3.6（折点波次推进 + eob 收拢过冲）；
       细缝线完成时金→青换装（3.3–3.7）；4.2 数字牌进场同刻两矩形组降权 0.55（H27 交接） */
    var p1 = foldPts(L1S, L1F, 2.2, t);
    var p2 = foldPts(L2S, L2F, 2.2, t);
    var s1 = ptsStr(p1), s2 = ptsStr(p2);
    fill1.setAttribute('points', s1); st1g.setAttribute('points', s1); st1c.setAttribute('points', s1);
    fill2.setAttribute('points', s2); st2.setAttribute('points', s2);
    var stIn = Math.min(1, F.seg(t, 2.2, 2.45) * 4);
    var grDim = F.lerp(1, .55, F.seg(t, 4.2, 5.0));
    g1.style.opacity = stIn * grDim;
    g2.style.opacity = stIn * grDim;
    var fl = 3 * Math.sin(Math.PI * F.seg(t, 6.25, 6.8));   /* 重锤触地：两形被震得回弹 */
    g1.style.transform = g2.style.transform = fl > 0 ? 'translateY(' + fl.toFixed(2) + 'px)' : '';
    var cyu = F.seg(t, 3.3, 3.7);
    st1g.style.opacity = 1 - cyu;
    st1c.style.opacity = cyu;
    var fillU = F.eoc(F.seg(t, 3.35, 3.75));
    fill1.setAttribute('fill-opacity', (.10 * fillU).toFixed(3));
    fill2.setAttribute('fill-opacity', (.12 * fillU).toFixed(3));

    /* 缝点：两端相遇合拢（40m 恰好用完的自证），落定脉冲后随组降权 */
    var smDim = F.lerp(1, .5, F.seg(t, 4.2, 5.0));
    [['seam1', p1[4]], ['seam2', p2[4]]].forEach(function (it) {
      var el = $(it[0]);
      el.setAttribute('cx', it[1].x.toFixed(1)); el.setAttribute('cy', it[1].y.toFixed(1));
      el.style.opacity = F.eoc(F.seg(t, 3.4, 3.6)) * smDim;
      el.setAttribute('r', (4 + 4 * Math.sin(Math.PI * F.seg(t, 3.4, 4.1))).toFixed(2));
    });

    /* 方块金晕 2Hz 常驻【H15】 */
    var glow = .5 + .5 * Math.sin(2 * Math.PI * 2 * t);
    st2.style.filter = 'drop-shadow(0 0 ' + (14 + 20 * glow) + 'px rgba(232,182,76,' + (.22 + .33 * glow).toFixed(3) + '))';

    /* 边长标注（附着并入宿主组，不另计主体） */
    var lu = F.eic(F.seg(t, 3.7, 4.1));
    ['lab19', 'lab1', 'lab10a', 'lab10b'].forEach(function (id) {
      $(id).style.opacity = lu * grDim;
    });

    /* 数字牌弹性缩放过冲落位（非印章样式）；
       5.8 问题字幕重锤进场，同刻数字牌对降权 0.6（H27 交接） */
    var nd = F.lerp(1, .6, F.seg(t, 5.8, 6.4));
    [['n19', 4.2], ['n100', 4.4]].forEach(function (it) {
      var u = F.eob(F.seg(t, it[1], it[1] + .8));
      var el = $(it[0]);
      el.style.opacity = Math.min(1, F.seg(t, it[1], it[1] + .3) * 3) * nd;
      el.style.transform = 'scale(' + F.lerp(1.35, 1, Math.min(1, u)) + ')';
    });

    /* 字幕① 5.8 重锤天降：2.6× 巨型自屏外 eic 加速坠下，6.25 整式砸入字幕带；
       触地双冲击环+金晕爆闪+火花四溅（全屏震颤在 sc 段、两形回弹在折叠组段）；
       【5倍多】关键词 2Hz 金晕呼吸驻留【H15】至 8.4，8.8 收口（3.0s，H26） */
    var fall = F.eic(F.seg(t, 5.8, 6.25));
    cap.style.opacity = Math.min(1, F.seg(t, 5.8, 6.0) * 2.2) * (1 - F.seg(t, 8.4, 8.8));
    cap.style.transform = 'translateX(-50%) translateY(' + ((1 - fall) * -760).toFixed(1) +
      'px) scale(' + F.lerp(2.6, 1, fall).toFixed(3) + ')';
    var kw = Math.sin(Math.PI * F.seg(t, 6.3, 8.7));
    capK.style.textShadow = kw > 0
      ? '0 0 ' + (18 * kw * (0.55 + 0.45 * Math.sin(2 * Math.PI * 2 * t))).toFixed(1) + 'px rgba(255,215,106,.95)'
      : '';
    for (var ri = 0; ri < rings.length; ri++) {
      var rg = rings[ri], ru = F.seg(t, rg.t0, rg.t0 + .55), rs = rg.s0 + rg.sz * F.eoc(ru);
      rg.e.style.width = rg.e.style.height = rs.toFixed(1) + 'px';
      rg.e.style.opacity = (ru > 0 && ru < 1 ? (0.9 - 0.25 * ri) * (1 - ru) : 0).toFixed(3);
    }
    var bU = F.eoc(F.seg(t, 6.25, 6.8));
    bloom.style.opacity = (F.seg(t, 6.25, 6.8) > 0 && F.seg(t, 6.25, 6.8) < 1 ? .55 * (1 - F.seg(t, 6.25, 6.8)) : 0).toFixed(3);
    bloom.style.transform = 'translate(-50%,-50%) scale(' + F.lerp(1, 1.5, bU).toFixed(3) + ')';
    burst.update(t, 6.25, .6);

    /* 6.25 重锤触地：全屏 7px 衰减震颤（8.5Hz）；7.0–9.0 全画面下压让位 + 星点/光尘环境层 */
    var pr = F.eic(F.seg(t, 7.0, 9.0));
    var iu = t - 6.25;
    var shk = iu > 0 && iu < .8 ? 7 * Math.sin(2 * Math.PI * 8.5 * iu) * Math.exp(-5.5 * iu) : 0;
    sc.style.transform = 'translateY(' + shk.toFixed(2) + 'px) scale(' + F.lerp(1, .97, pr).toFixed(4) + ')';
    sc.style.filter = 'brightness(' + F.lerp(1, .88, pr) + ')';
    var stU = F.eoc(F.seg(t, 7.0, 7.6));
    for (var i = 0; i < stars.length; i++) {
      var s = stars[i], tw = .45 + .4 * (0.5 + 0.5 * Math.sin(2 * Math.PI * s.f * t + s.p));
      s.e.style.opacity = stU * tw;
      s.e.style.width = s.e.style.height = s.s + 'px';
      s.e.style.left = s.x + 'px'; s.e.style.top = s.y + 'px';
    }
    starHost.style.opacity = 1;
    $('riseHost').style.opacity = F.eoc(F.seg(t, 7.0, 7.4));
    rise.update(t);
  }
};
</script>
</body>
</html>
