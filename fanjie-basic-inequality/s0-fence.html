<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="shared.css">
<style>
  #sc{position:absolute;inset:0;transform-origin:960px 540px;}
  #cone{position:absolute;left:560px;top:-120px;width:1000px;height:1020px;
    clip-path:polygon(80% 0,97% 0,40% 100%,10% 100%);
    background:linear-gradient(205deg,rgba(244,246,250,.17),rgba(244,246,250,.05) 55%,transparent 78%);
    filter:blur(3px);opacity:0;transform-origin:1000px 900px;}
  #fence{position:absolute;left:300px;top:539px;height:3px;width:0;
    background:linear-gradient(90deg,var(--pri),var(--pri-hi) 60%,var(--pri));
    box-shadow:0 0 16px rgba(232,182,76,.45);opacity:0;}
  #chip40{position:absolute;left:1462px;top:492px;opacity:0;font-size:30px;color:var(--pri-hi);}
  #slit{position:absolute;left:760px;width:380px;height:20px;top:540px;opacity:0;
    border:2.5px solid var(--sec);border-radius:4px;box-shadow:0 0 14px rgba(88,196,212,.35);}
  #sq{position:absolute;left:1220px;width:200px;height:200px;top:540px;opacity:0;
    border:3px solid var(--pri);border-radius:6px;transform-origin:50% 0;}
  #n19{position:absolute;left:950px;top:196px;opacity:0;}
  #n100{position:absolute;left:1320px;top:822px;opacity:0;}
  .num{font-size:44px;letter-spacing:.04em;display:inline-block;transform-origin:50% 50%;}
  #gapbar{position:absolute;left:790px;top:872px;width:340px;height:52px;opacity:0;
    border:2.5px dashed var(--ter);border-radius:10px;display:flex;align-items:center;justify-content:center;
    font-size:32px;color:var(--ter);background:rgba(255,154,61,.06);}
  #starHost,#riseHost{position:absolute;inset:0;}
</style>
</head>
<body>
<div id="sc">
  <div id="starHost"></div>
  <div id="cone"></div>
  <div id="fence"></div>
  <div id="chip40" class="chip">40m</div>
  <div id="slit"></div>
  <div id="sq"></div>
  <span id="n19" class="num" style="color:var(--sec-hi);">19㎡</span>
  <span id="n100" class="num" style="color:var(--pri-hi);">100㎡</span>
  <div id="gapbar">−81㎡</div>
  <div id="riseHost"></div>
</div>
<div class="vign"></div>
<div class="cap">同样40米，<span class="k">差5倍多</span>？</div>

<script src="shared.js"></script>
<script type="module">
var $ = function (id) { return document.getElementById(id); };
var sc = $('sc'), cone = $('cone'), fence = $('fence'), chip = $('chip40'),
    slit = $('slit'), sq = $('sq'), n19 = $('n19'), n100 = $('n100'),
    gap = $('gapbar'), starHost = $('starHost');

/* 星点环境层（种子 3）：各点独立频率闪烁 */
var r3 = F.rng(3), stars = [];
for (var i = 0; i < 26; i++) {
  var d = document.createElement('div'); d.className = 'p';
  d.style.background = 'rgba(244,246,250,.9)';
  starHost.appendChild(d);
  stars.push({ e: d, x: 80 + r3() * 1760, y: 60 + r3() * 380, s: 1.5 + r3() * 2.4, f: .5 + r3() * .8, p: r3() * 6.28 });
}
var rise = F.makeRise($('riseHost'), 960, 620, 320, 16, 3, 'rgba(232,182,76,.8)');

window.film = {
  duration: 9,
  frame: function (t) {
    /* 光锥：0–0.8 淡入 + 宽度呼吸扩张；5.8–6.6 渐隐 */
    var cu = F.eoc(F.seg(t, 0, .8));
    var breathe = 1 + .05 * Math.sin(2 * Math.PI * .35 * t);
    cone.style.opacity = cu * F.lerp(.85, 0, F.seg(t, 5.8, 6.6));
    cone.style.transform = 'scaleX(' + breathe + ')';

    /* 篱笆金线 0.8–1.0 左→右点亮 + 40m chip 上浮 */
    var fu = F.eoq(F.seg(t, .8, 1.0));
    fence.style.width = (1320 * fu) + 'px';
    fence.style.opacity = .95;
    var chu = F.eoc(F.seg(t, .9, 1.2));
    chip.style.opacity = chu;
    chip.style.transform = 'translateY(' + ((1 - chu) * 12) + 'px)';

    /* 细缝自金线撕出上移（eic）；方块自金线折叠围成（eob 过冲） */
    var su = F.eic(F.seg(t, 2.2, 3.2));
    slit.style.opacity = Math.min(1, su * 3);
    slit.style.top = F.lerp(540, 280, su) + 'px';
    var qu = F.eob(F.seg(t, 2.2, 3.2));
    sq.style.opacity = Math.min(1, F.seg(t, 2.2, 2.5) * 3);
    sq.style.top = F.lerp(540, 600, Math.max(0, Math.min(1, qu))) + 'px';
    sq.style.transform = 'scaleY(' + Math.max(.02, qu) + ')';
    var glow = .5 + .5 * Math.sin(2 * Math.PI * 2 * t);      /* 2Hz 金晕常驻【H15】 */
    sq.style.boxShadow = '0 0 ' + (14 + 22 * glow) + 'px rgba(232,182,76,' + (.18 + .3 * glow) + ')';

    /* 数字牌弹性缩放过冲落位（非印章样式） */
    [['n19', 4.2], ['n100', 4.4]].forEach(function (it) {
      var u = F.eob(F.seg(t, it[1], it[1] + .8));
      var el = $(it[0]);
      el.style.opacity = Math.min(1, F.seg(t, it[1], it[1] + .3) * 3);
      el.style.transform = 'scale(' + F.lerp(1.35, 1, Math.min(1, u)) + ')';
    });

    /* 橙虚线差额条弹出 + 8px 二次衰减轻抖 */
    var gu = F.eob(F.seg(t, 5.8, 6.4));
    gap.style.opacity = Math.min(1, gu * 3);
    var tk = Math.max(0, t - 5.8), shake = 8 * Math.sin(12 * Math.PI * tk) * Math.exp(-3 * tk);
    gap.style.transform = 'translateX(' + shake + 'px) scale(' + F.lerp(1.18, 1, Math.min(1, gu)) + ')';

    /* 7.0–9.0 全画面下压让位 + 星点/光尘环境层 */
    var pr = F.eic(F.seg(t, 7.0, 9.0));
    sc.style.transform = 'scale(' + F.lerp(1, .97, pr) + ')';
    sc.style.filter = 'brightness(' + F.lerp(1, .88, pr) + ')';
    var stU = F.eoc(F.seg(t, 7.0, 7.6));
    for (var i = 0; i < stars.length; i++) {
      var s = stars[i], tw = .45 + .4 * (0.5 + 0.5 * Math.sin(2 * Math.PI * s.f * t + s.p));
      s.e.style.opacity = stU * tw;
      s.e.style.width = s.e.style.height = s.s + 'px';
      s.e.style.left = s.x + 'px'; s.e.style.top = s.y + 'px';
    }
    starHost.style.opacity = 1;
    $('riseHost').style.opacity = F.eoc(F.seg(t, 7.0, 7.4));
    rise.update(t);

    /* 字幕① 1.2–4.2（3.0s，H26） */
    F.capShow(document.querySelector('.cap'), t, 1.2, 4.2);
  }
};
</script>
</body>
</html>
